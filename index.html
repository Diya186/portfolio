<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Diya — Universe</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,700;1,700&family=Plus+Jakarta+Sans:wght@400;600&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#07060c;color:#f2eff9;font-family:'Plus Jakarta Sans',sans-serif;cursor:none}

#cursor{position:fixed;width:9px;height:9px;border-radius:50%;background:#b8a9f8;pointer-events:none;z-index:9999;transform:translate(-50%,-50%);box-shadow:0 0 12px 4px rgba(184,169,248,0.6);mix-blend-mode:screen}

canvas{position:fixed;top:0;left:0;width:100%;height:100%}
#starCanvas{z-index:1}
#orbCanvas{z-index:2;pointer-events:none}

/* ── LAYERS ── */
.layer{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none}
.layer.show{opacity:1;pointer-events:all}

/* ── HI SCREEN — small centered ── */
#layerHi{flex-direction:column;text-align:center;gap:0.15em}
.hiLine{
  font-family:'Cormorant Garamond',serif;font-weight:700;
  font-size:clamp(2rem,5vw,4.2rem);line-height:1;
  display:block;opacity:0;transform:translateY(18px);
  transition:opacity 0.55s ease, transform 0.55s ease;
}
.hiLine.in{opacity:1;transform:translateY(0)}
#hiName{
  font-style:italic;
  background:linear-gradient(135deg,#b8a9f8,#e0abfc,#93c5fd);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}

/* ── IDENTITY SCREEN ── */
#layerIdentity{
  flex-direction:row;
  align-items:center;
  justify-content:flex-start;
  padding:0 10vw;
  gap:1.5rem;
}
#idIm{
  font-family:'Cormorant Garamond',serif;font-weight:700;
  font-size:clamp(3rem,8vw,7rem);line-height:1;
  color:#f2eff9;
  opacity:0;
  /* starts centered, slides left */
  position:relative;
  transition:opacity 0.5s ease, transform 0.7s cubic-bezier(0.4,0,0.2,1);
  transform:translateX(30vw);
  white-space:nowrap;
}
#idIm.center{opacity:1;transform:translateX(30vw)}
#idIm.left{opacity:1;transform:translateX(0)}

#idWord{
  font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:700;
  font-size:clamp(3rem,8vw,7rem);line-height:1;
  background:linear-gradient(135deg,#b8a9f8,#e0abfc);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  display:block;opacity:0;transform:translateX(-14px);
  transition:opacity 0.38s ease,transform 0.38s ease;
  white-space:nowrap;
}
#idWord.in{opacity:1;transform:translateX(0)}

/* ── FINAL STATEMENT — small centered ── */
#layerFinal{flex-direction:column;text-align:center}
#idFinal{
  font-family:'Cormorant Garamond',serif;font-weight:700;font-style:italic;
  font-size:clamp(1.8rem,4vw,3.2rem);line-height:1.15;
  opacity:0;transition:opacity 1s ease;max-width:22ch;
}
#idFinal.in{opacity:1}
#idFinal em{
  background:linear-gradient(135deg,#b8a9f8,#e0abfc,#93c5fd);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  font-style:italic;
}

/* ── HUB SCREEN ── */
#layerHub{flex-direction:column;align-items:center;gap:2rem;padding:1.5rem 4vw;justify-content:center;overflow-y:auto}
.hubEye{font-size:0.68rem;letter-spacing:0.22em;text-transform:uppercase;color:#5a5570;opacity:0;transition:opacity 0.6s ease 0.2s}
.hubEye.in{opacity:1}
.hubTitle{
  font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:700;
  font-size:clamp(1.4rem,3vw,2.4rem);text-align:center;
  opacity:0;transform:translateY(14px);transition:opacity 0.7s ease 0.35s,transform 0.7s ease 0.35s;
}
.hubTitle.in{opacity:1;transform:translateY(0)}

/* ── CHARACTERS ── */
.charsGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:2rem;width:min(940px,88vw);opacity:0;transition:opacity 0.5s ease 0.55s}
.charsGrid.in{opacity:1}
.charCard{display:flex;flex-direction:column;align-items:center;cursor:pointer;position:relative;opacity:0;transform:translateY(20px);transition:opacity 0.5s ease,transform 0.5s ease}
.charCard.in{opacity:1;transform:translateY(0)}

.charImgWrap{width:100%;aspect-ratio:0.72;display:flex;align-items:flex-end;justify-content:center;position:relative}
.charImg{
  width:85%;height:100%;object-fit:contain;object-position:bottom;
  filter:drop-shadow(0 8px 20px rgba(0,0,0,0.5));
  transform-origin:bottom center;
  /* floating animation */
  animation:charFloat 4s ease-in-out infinite;
}
.charCard:nth-child(1) .charImg{animation-delay:0s}
.charCard:nth-child(2) .charImg{animation-delay:0.6s}
.charCard:nth-child(3) .charImg{animation-delay:1.2s}
.charCard:nth-child(4) .charImg{animation-delay:1.8s}

@keyframes charFloat{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-9px)}
}

.charCard:hover .charImg{
  filter:drop-shadow(0 12px 28px rgba(0,0,0,0.4));
  animation-play-state:paused;
  transform:translateY(-12px) scale(1.04);
  transition:transform 0.35s cubic-bezier(0.34,1.56,0.64,1),filter 0.3s ease;
}
.charCard[data-w="coder"]:hover .charImg{filter:drop-shadow(0 12px 32px rgba(34,211,238,0.45))}
.charCard[data-w="creator"]:hover .charImg{filter:drop-shadow(0 12px 32px rgba(251,146,60,0.45))}
.charCard[data-w="writer"]:hover .charImg{filter:drop-shadow(0 12px 32px rgba(129,140,248,0.45))}
.charCard[data-w="facts"]:hover .charImg{filter:drop-shadow(0 12px 32px rgba(249,168,212,0.45))}

/* stickers */
.stk{position:absolute;font-size:0.95rem;opacity:0;pointer-events:none;transition:opacity 0.25s;animation:stkf 3s ease-in-out infinite}
.charCard:hover .stk{opacity:1}
@keyframes stkf{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-6px) rotate(4deg)}}
.charCard[data-w="coder"] .stk:nth-child(1){top:8%;left:-5%;animation-delay:0s}
.charCard[data-w="coder"] .stk:nth-child(2){top:30%;right:-5%;animation-delay:0.4s}
.charCard[data-w="coder"] .stk:nth-child(3){top:58%;left:-8%;animation-delay:0.8s}
.charCard[data-w="coder"] .stk:nth-child(4){bottom:16%;right:-4%;animation-delay:0.2s}
.charCard[data-w="creator"] .stk:nth-child(1){top:8%;right:-5%;animation-delay:0.1s}
.charCard[data-w="creator"] .stk:nth-child(2){top:35%;left:-8%;animation-delay:0.5s}
.charCard[data-w="creator"] .stk:nth-child(3){bottom:20%;right:-7%;animation-delay:0.9s}
.charCard[data-w="creator"] .stk:nth-child(4){top:60%;left:-5%;animation-delay:0.3s}
.charCard[data-w="writer"] .stk:nth-child(1){top:12%;left:-7%;animation-delay:0.2s}
.charCard[data-w="writer"] .stk:nth-child(2){top:40%;right:-7%;animation-delay:0.6s}
.charCard[data-w="writer"] .stk:nth-child(3){bottom:18%;left:-5%;animation-delay:0s}
.charCard[data-w="writer"] .stk:nth-child(4){top:65%;right:-5%;animation-delay:0.4s}
.charCard[data-w="facts"] .stk:nth-child(1){top:6%;right:-7%;animation-delay:0.3s}
.charCard[data-w="facts"] .stk:nth-child(2){top:32%;left:-9%;animation-delay:0.7s}
.charCard[data-w="facts"] .stk:nth-child(3){bottom:22%;right:-5%;animation-delay:0.1s}
.charCard[data-w="facts"] .stk:nth-child(4){top:57%;left:-5%;animation-delay:0.5s}

.charLabel{margin-top:0.7rem;text-align:center}
.charNum{font-size:0.58rem;letter-spacing:0.18em;color:#5a5570;display:block;margin-bottom:0.1rem}
.charName{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:700;font-size:0.95rem;color:#f2eff9;display:block;transition:color 0.2s}
.charCard[data-w="coder"]:hover .charName{color:#22d3ee}
.charCard[data-w="creator"]:hover .charName{color:#fb923c}
.charCard[data-w="writer"]:hover .charName{color:#818cf8}
.charCard[data-w="facts"]:hover .charName{color:#f9a8d4}

/* world transition overlay */
#wOverlay{position:fixed;inset:0;z-index:500;opacity:0;pointer-events:none;transition:opacity 0.5s ease}

/* skip / sound */
#skipBtn{position:fixed;bottom:1.8rem;right:1.8rem;z-index:100;font-size:0.68rem;letter-spacing:0.12em;text-transform:uppercase;color:#5a5570;background:none;border:1px solid rgba(255,255,255,0.08);padding:0.45rem 0.9rem;border-radius:2rem;cursor:pointer;opacity:0;transition:color 0.2s,border-color 0.2s;pointer-events:none}
#skipBtn.show{opacity:1;pointer-events:all}
#skipBtn:hover{color:#f2eff9;border-color:rgba(255,255,255,0.2)}
#soundBtn{position:fixed;bottom:1.8rem;left:1.8rem;z-index:100;font-size:0.95rem;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:50%;width:34px;height:34px;cursor:pointer;opacity:0;display:flex;align-items:center;justify-content:center;transition:opacity 0.5s;pointer-events:none}
#soundBtn.show{opacity:1;pointer-events:all}

@media(max-width:640px){
  .charsGrid{grid-template-columns:repeat(2,1fr);gap:1.2rem}
  #layerIdentity{padding:0 7vw}
}
</style>
</head>
<body>

<div id="cursor"></div>
<canvas id="starCanvas"></canvas>
<canvas id="orbCanvas"></canvas>
<div id="wOverlay"></div>

<!-- HI SCREEN -->
<div id="layerHi" class="layer">
  <span class="hiLine" id="hiHi">Hi!</span>
  <span class="hiLine" id="hiIm">I'm</span>
  <span class="hiLine" id="hiName">Diya.</span>
</div>

<!-- IDENTITY SCREEN -->
<div id="layerIdentity" class="layer">
  <span id="idIm">I'm</span>
  <span id="idWord">a creator.</span>
</div>

<!-- FINAL STATEMENT -->
<div id="layerFinal" class="layer">
  <p id="idFinal">I'm here to make a <em>difference.</em></p>
</div>

<!-- HUB SCREEN -->
<div id="layerHub" class="layer">
  <span class="hubEye" id="hubEye">choose your world</span>
  <h1 class="hubTitle" id="hubTitle">Which Diya do you want to meet?</h1>
  <div class="charsGrid" id="charsGrid">

    <div class="charCard" data-w="coder" onclick="enterWorld('coder')">
      <span class="stk">💻</span><span class="stk">⟨/⟩</span><span class="stk">⚡</span><span class="stk">🔒</span>
      <div class="charImgWrap"><img class="charImg" src="coder.png" alt="Coder Diya"/></div>
      <div class="charLabel"><span class="charNum">WORLD 01</span><span class="charName">Coder Diya</span></div>
    </div>

    <div class="charCard" data-w="creator" onclick="enterWorld('creator')">
      <span class="stk">📱</span><span class="stk">🎬</span><span class="stk">❤️</span><span class="stk">✨</span>
      <div class="charImgWrap"><img class="charImg" src="creator.png" alt="Creator Diya"/></div>
      <div class="charLabel"><span class="charNum">WORLD 02</span><span class="charName">Creator Diya</span></div>
    </div>

    <div class="charCard" data-w="writer" onclick="enterWorld('writer')">
      <span class="stk">✍️</span><span class="stk">🌙</span><span class="stk">🪶</span><span class="stk">📖</span>
      <div class="charImgWrap"><img class="charImg" src="writer.png" alt="Writer Diya"/></div>
      <div class="charLabel"><span class="charNum">WORLD 03</span><span class="charName">Writer Diya</span></div>
    </div>

    <div class="charCard" data-w="facts" onclick="enterWorld('facts')">
      <span class="stk">🧶</span><span class="stk">🎵</span><span class="stk">🌸</span><span class="stk">☕</span>
      <div class="charImgWrap"><img class="charImg" src="random.png" alt="Just Diya"/></div>
      <div class="charLabel"><span class="charNum">WORLD 04</span><span class="charName">Just Diya</span></div>
    </div>

  </div>
</div>

<button id="skipBtn" onclick="skipToHub()">Skip intro</button>
<button id="soundBtn">🔊</button>

<script>
// ── CURSOR ──
document.addEventListener('mousemove',e=>{
  const c=document.getElementById('cursor');
  c.style.left=e.clientX+'px'; c.style.top=e.clientY+'px';
});

// ── AUDIO ──
let soundOn=true, actx=null;
function initAudio(){
  if(actx)return;
  try{actx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}
}
['click','keydown','touchstart'].forEach(ev=>document.addEventListener(ev,initAudio,{once:true}));
document.getElementById('soundBtn').onclick=()=>{
  soundOn=!soundOn;
  document.getElementById('soundBtn').textContent=soundOn?'🔊':'🔇';
};
function playT(freq,dur,vol,type){
  if(!soundOn||!actx)return;
  try{
    const o=actx.createOscillator(),g=actx.createGain();
    o.connect(g);g.connect(actx.destination);
    o.type=type||'triangle';o.frequency.value=freq;
    g.gain.setValueAtTime(vol||0.1,actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+dur);
    o.start();o.stop(actx.currentTime+dur);
  }catch(e){}
}
function chime(f){playT(f||523,0.6,0.1);}
function bounceSfx(n){playT(150+n*25,0.14,0.18,'sine');}
function revealChime(){[523,659,784,1046].forEach((f,i)=>setTimeout(()=>chime(f),i*80));}
function whooshSfx(){
  if(!soundOn||!actx)return;
  try{
    const buf=actx.createBuffer(1,actx.sampleRate*0.3,actx.sampleRate);
    const d=buf.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    const s=actx.createBufferSource(),f=actx.createBiquadFilter(),g=actx.createGain();
    f.type='bandpass';f.frequency.value=500;
    s.buffer=buf;s.connect(f);f.connect(g);g.connect(actx.destination);
    g.gain.setValueAtTime(0.08,actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+0.3);
    s.start();s.stop(actx.currentTime+0.3);
  }catch(e){}
}

// ── STARS ──
const SC=document.getElementById('starCanvas'),SX=SC.getContext('2d');
let stars=[];
function resizeStars(){
  SC.width=innerWidth;SC.height=innerHeight;
  stars=Array.from({length:130},()=>({
    x:Math.random()*SC.width,y:Math.random()*SC.height,
    r:Math.random()*1.1+0.15,o:Math.random()*0.28+0.05,
    sp:Math.random()*0.4+0.05
  }));
}
function drawStars(){
  SX.clearRect(0,0,SC.width,SC.height);
  stars.forEach(s=>{
    s.o+=Math.sin(Date.now()*s.sp*0.001)*0.003;
    SX.beginPath();SX.arc(s.x,s.y,s.r,0,Math.PI*2);
    SX.fillStyle=`rgba(200,190,255,${Math.abs(s.o)})`;SX.fill();
  });
}

// ── ORB ──
const OC=document.getElementById('orbCanvas'),OX=OC.getContext('2d');
let ox,oy,ovx=3.8,ovy=0;
const OR=13;
let particles=[],trailPts=[],bCount=0;
// phases: bounce | settling | floating | swirl | done
let orbPhase='bounce';
let settleT=0,settleFromX=0,settleFromY=0;
let swirlT=0,swirlStartX=0,swirlStartY=0;
let onSwirlDone=null;

function resizeOrb(){
  OC.width=innerWidth;OC.height=innerHeight;
  ox=innerWidth/2;oy=-50;
}

function spawnP(x,y){
  for(let i=0;i<10;i++){
    const a=(Math.PI*2/10)*i+Math.random()*0.6,sp=Math.random()*2.2+0.8;
    particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-0.8,
      life:1,r:Math.random()*2.5+1.2,
      c:['#b8a9f8','#e0abfc','#93c5fd','#c4b5fd'][0|Math.random()*4]});
  }
}

function drawOrbShape(x,y,sx,sy,alpha){
  const r=OR;
  OX.save();OX.translate(x,y);OX.scale(sx||1,sy||1);
  // glow
  const g1=OX.createRadialGradient(0,0,r*.1,0,0,r*3.2);
  g1.addColorStop(0,`rgba(184,169,248,${0.3*alpha})`);
  g1.addColorStop(0.5,`rgba(124,58,237,${0.1*alpha})`);
  g1.addColorStop(1,'rgba(0,0,0,0)');
  OX.beginPath();OX.arc(0,0,r*3.2,0,Math.PI*2);OX.fillStyle=g1;OX.fill();
  // body
  const g2=OX.createRadialGradient(-r*.3,-r*.3,r*.05,0,0,r);
  g2.addColorStop(0,`rgba(255,255,255,${0.95*alpha})`);
  g2.addColorStop(0.3,`rgba(200,180,255,${0.9*alpha})`);
  g2.addColorStop(0.7,`rgba(124,58,237,${0.85*alpha})`);
  g2.addColorStop(1,`rgba(55,15,130,${0.8*alpha})`);
  OX.beginPath();OX.arc(0,0,r,0,Math.PI*2);OX.fillStyle=g2;OX.fill();
  // shine
  OX.beginPath();
  OX.ellipse(-r*.28,-r*.3,r*.2,r*.12,-Math.PI/4,0,Math.PI*2);
  OX.fillStyle=`rgba(255,255,255,${0.5*alpha})`;OX.fill();
  OX.restore();
}

let orbAlpha=1;

function updateOrb(){
  OX.clearRect(0,0,OC.width,OC.height);

  // particles
  particles=particles.filter(p=>p.life>0);
  particles.forEach(p=>{
    p.x+=p.vx;p.y+=p.vy;p.vy+=0.07;p.life-=0.025;
    const pr=Math.max(0.01,p.r*p.life);
    const h=(Math.max(0,p.life*255)|0).toString(16).padStart(2,'0');
    OX.beginPath();OX.arc(p.x,p.y,pr,0,Math.PI*2);
    OX.fillStyle=p.c+h;OX.fill();
  });

  // trail
  trailPts.push({x:ox,y:oy,t:Date.now()});
  trailPts=trailPts.filter(p=>Date.now()-p.t<200);
  trailPts.forEach((p,i)=>{
    const a=(i/trailPts.length)*0.09;
    const r2=Math.max(0.01,OR*(i/trailPts.length)*0.4);
    OX.beginPath();OX.arc(p.x,p.y,r2,0,Math.PI*2);
    OX.fillStyle=`rgba(184,169,248,${a})`;OX.fill();
  });

  if(orbPhase==='done') return;

  if(orbPhase==='bounce'){
    ovy+=0.55;ox+=ovx;oy+=ovy;
    const FLOOR=OC.height*0.7;
    const sy=ovy>0?1.12:1,sx=ovy>0?0.88:1;
    if(oy+OR>=FLOOR&&ovy>0){
      oy=FLOOR-OR;ovy*=-0.62;bCount++;
      spawnP(ox,FLOOR);bounceSfx(bCount);
      if(bCount>=4){
        orbPhase='settling';
        settleT=Date.now();
        settleFromX=ox;settleFromY=oy;
      }
    }
    if(ox-OR>OC.width)ox=-OR;
    if(ox+OR<0)ox=OC.width+OR;
    drawOrbShape(ox,oy,sx,sy,1);
    return;
  }

  if(orbPhase==='settling'){
    const el=Date.now()-settleT,dur=700;
    const t=Math.min(el/dur,1);
    const e=1-Math.pow(1-t,3);
    const tx=OC.width/2,ty=OC.height/2;
    ox=settleFromX+(tx-settleFromX)*e;
    oy=settleFromY+(ty-settleFromY)*e;
    drawOrbShape(ox,oy,1,1,1);
    if(t>=1){
      ox=tx;oy=ty;
      orbPhase='floating';
      revealChime();
      setTimeout(startHiScreen,350);
    }
    return;
  }

  if(orbPhase==='floating'){
    orbAlpha=Math.max(0,orbAlpha-0.018);
    if(orbAlpha>0){
      const fy=oy+Math.sin(Date.now()*0.002)*4;
      drawOrbShape(ox,fy,1,1,orbAlpha);
    }
    return;
  }

  if(orbPhase==='swirl'){
    const el=Date.now()-swirlT,dur=900;
    const t=Math.min(el/dur,1);
    const angle=t*Math.PI*4; // two full spins
    const radius=OR*3*(1-t);
    const scale=1-t*0.8;
    const alpha=1-t;
    const sx=swirlStartX+Math.cos(angle)*radius;
    const sy2=swirlStartY+Math.sin(angle)*radius;
    ox=sx;oy=sy2;
    if(alpha>0.02) drawOrbShape(sx,sy2,scale,scale,alpha);
    if(t>=1){
      orbPhase='done';
      if(onSwirlDone) onSwirlDone();
    }
    return;
  }
}

// ── MAIN LOOP ──
function loop(){drawStars();updateOrb();requestAnimationFrame(loop);}

// ── HELPERS ──
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

function showLayer(id){
  const el=document.getElementById(id);
  el.style.transition='opacity 0.5s ease';
  el.classList.add('show');
}
function hideLayer(id){
  return new Promise(r=>{
    const el=document.getElementById(id);
    el.style.transition='opacity 0.45s ease';
    el.style.opacity='0';
    setTimeout(()=>{el.classList.remove('show');el.style.opacity='';r();},450);
  });
}

let skipped=false;

// ── HI SCREEN ──
async function startHiScreen(){
  if(skipped)return;
  showLayer('layerHi');
  document.getElementById('skipBtn').classList.add('show');
  document.getElementById('soundBtn').classList.add('show');

  await sleep(200);
  document.getElementById('hiHi').classList.add('in'); chime(523);
  await sleep(320);
  document.getElementById('hiIm').classList.add('in');
  await sleep(320);
  document.getElementById('hiName').classList.add('in'); chime(880);
  await sleep(2400);
  if(skipped)return;

  // fade out all three, then transition
  ['hiHi','hiIm','hiName'].forEach(id=>{
    const el=document.getElementById(id);
    el.style.transition='opacity 0.4s';
    el.style.opacity='0';
  });
  await sleep(500);
  await hideLayer('layerHi');
  if(skipped)return;
  startIdentityScreen();
}

// ── IDENTITY SCREEN ──
const IDS=['a creator.','a coder.','a writer.','an editor.',
  'a storyteller.','a student.','a dreamer.','a builder.','an entrepreneur.'];
const FREQS=[523,587,659,698,784,880,988,1047,1175];

async function startIdentityScreen(){
  if(skipped)return;
  showLayer('layerIdentity');
  const im=document.getElementById('idIm');
  const wd=document.getElementById('idWord');
  wd.style.opacity='0';
  wd.classList.remove('in');

  // step 1: "I'm" appears centered
  await sleep(150);
  im.classList.add('center');
  await sleep(900);

  // step 2: "I'm" slides to left, words start cycling
  im.classList.remove('center');
  im.classList.add('left');
  await sleep(500); // wait for slide to finish

  for(let i=0;i<IDS.length;i++){
    if(skipped)return;
    wd.textContent=IDS[i];
    wd.classList.add('in');
    chime(FREQS[i]);
    await sleep(i<6?720:920);
    wd.classList.remove('in');
    await sleep(320);
  }

  await hideLayer('layerIdentity');
  if(skipped)return;
  startFinalScreen();
}

// ── FINAL STATEMENT ──
async function startFinalScreen(){
  if(skipped)return;
  showLayer('layerFinal');
  await sleep(100);
  document.getElementById('idFinal').classList.add('in');
  revealChime();
  await sleep(2800);
  if(skipped)return;
  await hideLayer('layerFinal');

  // trigger orb swirl before hub
  orbPhase='swirl';
  swirlT=Date.now();
  swirlStartX=ox;swirlStartY=oy;
  onSwirlDone=()=>{ setTimeout(startHub,200); };
  whooshSfx();
}

// ── HUB ──
function startHub(){
  if(!document.getElementById('layerHub').classList.contains('show')){
    showLayer('layerHub');
  }
  revealChime();
  setTimeout(()=>document.getElementById('hubEye').classList.add('in'),250);
  setTimeout(()=>document.getElementById('hubTitle').classList.add('in'),400);
  setTimeout(()=>{
    const grid=document.getElementById('charsGrid');
    grid.classList.add('in');
    grid.querySelectorAll('.charCard').forEach((c,i)=>{
      setTimeout(()=>c.classList.add('in'),i*140+100);
    });
  },600);
  document.getElementById('skipBtn').classList.remove('show');
}

// ── SKIP ──
function skipToHub(){
  skipped=true;
  orbPhase='done';
  ['layerHi','layerIdentity','layerFinal'].forEach(id=>{
    const el=document.getElementById(id);
    el.style.opacity='0';el.style.pointerEvents='none';el.classList.remove('show');
  });
  document.getElementById('skipBtn').classList.remove('show');
  startHub();
}

// ── WORLD TRANSITION ──
const WC={coder:'#22d3ee',creator:'#fb923c',writer:'#818cf8',facts:'#f9a8d4'};
const WF={coder:'world-coder.html',creator:'world-creator.html',writer:'world-writer.html',facts:'world-facts.html'};
function enterWorld(w){
  const ov=document.getElementById('wOverlay');
  ov.style.background=WC[w];
  requestAnimationFrame(()=>{
    ov.style.opacity='1';
    setTimeout(()=>window.location.href=WF[w],520);
  });
  whooshSfx();chime(880);
}

// ── BOOT ──
window.addEventListener('resize',()=>{resizeStars();resizeOrb();});
resizeStars();
resizeOrb();
loop();
// start bouncing immediately — no click needed
</script>

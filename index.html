<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Diya — Universe</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,700;1,700&family=Plus+Jakarta+Sans:wght@400;600&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#07060c;color:#f2eff9;font-family:'Plus Jakarta Sans',sans-serif;cursor:none}

#cursor{position:fixed;width:10px;height:10px;border-radius:50%;background:#b8a9f8;pointer-events:none;z-index:9999;transform:translate(-50%,-50%);box-shadow:0 0 14px 5px rgba(184,169,248,0.6);mix-blend-mode:screen;transition:transform 0.1s}

canvas{position:fixed;top:0;left:0;width:100%;height:100%}
#starCanvas{z-index:1}
#orbCanvas{z-index:2;pointer-events:none}

/* ALL TEXT LAYERS — hidden by default */
.layer{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;flex-direction:column;opacity:0;pointer-events:none;transition:opacity 0.6s ease}
.layer.show{opacity:1;pointer-events:all}

/* HI SCREEN */
#layerHi{gap:0.05em;text-align:center}
.hiText{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:clamp(4rem,11vw,10rem);line-height:0.92;display:block;transform:translateY(30px);opacity:0;transition:opacity 0.6s ease, transform 0.6s ease}
.hiText.in{opacity:1;transform:translateY(0)}
#hiName{font-style:italic;background:linear-gradient(135deg,#b8a9f8,#e0abfc,#93c5fd);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}

/* IDENTITY SCREEN */
#layerIdentity{align-items:flex-start;padding:0 10vw;gap:0.8rem}
.idLabel{font-size:clamp(0.8rem,1.5vw,1rem);letter-spacing:0.12em;text-transform:uppercase;color:#5a5570}
#idWord{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:700;font-size:clamp(3.5rem,9vw,8rem);line-height:1;background:linear-gradient(135deg,#b8a9f8,#e0abfc);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;display:block;opacity:0;transform:translateX(-20px);transition:opacity 0.4s ease,transform 0.4s ease}
#idWord.in{opacity:1;transform:translateX(0)}
#idFinal{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:clamp(2.5rem,6vw,5.5rem);line-height:1.05;opacity:0;transition:opacity 1s ease;margin-top:1rem}
#idFinal.in{opacity:1}
#idFinal em{font-style:italic;background:linear-gradient(135deg,#b8a9f8,#e0abfc,#93c5fd);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}

/* HUB SCREEN */
#layerHub{flex-direction:column;gap:2rem;padding:1rem 4vw;overflow-y:auto;justify-content:center}
.hubEye{font-size:0.7rem;letter-spacing:0.22em;text-transform:uppercase;color:#5a5570;opacity:0;transition:opacity 0.6s ease 0.2s}
.hubEye.in{opacity:1}
.hubTitle{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:700;font-size:clamp(1.6rem,3.5vw,2.8rem);text-align:center;opacity:0;transform:translateY(16px);transition:opacity 0.7s ease 0.35s,transform 0.7s ease 0.35s}
.hubTitle.in{opacity:1;transform:translateY(0)}
.charsGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:1.5rem;width:min(960px,90vw);opacity:0;transition:opacity 0.6s ease 0.6s}
.charsGrid.in{opacity:1}

/* CHARACTER CARDS */
.charCard{display:flex;flex-direction:column;align-items:center;cursor:pointer;position:relative;opacity:0;transform:translateY(24px) scale(0.96);transition:opacity 0.55s ease,transform 0.55s ease}
.charCard.in{opacity:1;transform:translateY(0) scale(1)}
.charImgWrap{width:100%;aspect-ratio:0.72;display:flex;align-items:flex-end;justify-content:center}
.charImg{width:100%;height:100%;object-fit:contain;object-position:bottom;filter:drop-shadow(0 8px 24px rgba(0,0,0,0.5));transition:transform 0.4s cubic-bezier(0.34,1.56,0.64,1),filter 0.3s ease;transform-origin:bottom center}
.charCard:hover .charImg{transform:translateY(-10px) scale(1.04)}
.charCard[data-w="coder"]:hover .charImg{filter:drop-shadow(0 8px 32px rgba(34,211,238,0.45))}
.charCard[data-w="creator"]:hover .charImg{filter:drop-shadow(0 8px 32px rgba(251,146,60,0.45))}
.charCard[data-w="writer"]:hover .charImg{filter:drop-shadow(0 8px 32px rgba(129,140,248,0.45))}
.charCard[data-w="facts"]:hover .charImg{filter:drop-shadow(0 8px 32px rgba(249,168,212,0.45))}

/* stickers */
.stk{position:absolute;font-size:1rem;opacity:0;pointer-events:none;transition:opacity 0.3s;animation:stkf 3s ease-in-out infinite}
.charCard:hover .stk{opacity:1}
@keyframes stkf{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-6px) rotate(3deg)}}
.charCard[data-w="coder"] .stk:nth-child(1){top:8%;left:-8%;animation-delay:0s}
.charCard[data-w="coder"] .stk:nth-child(2){top:28%;right:-8%;animation-delay:0.4s}
.charCard[data-w="coder"] .stk:nth-child(3){top:55%;left:-10%;animation-delay:0.8s}
.charCard[data-w="coder"] .stk:nth-child(4){bottom:18%;right:-6%;animation-delay:0.2s}
.charCard[data-w="creator"] .stk:nth-child(1){top:8%;right:-8%;animation-delay:0.1s}
.charCard[data-w="creator"] .stk:nth-child(2){top:35%;left:-10%;animation-delay:0.5s}
.charCard[data-w="creator"] .stk:nth-child(3){bottom:22%;right:-10%;animation-delay:0.9s}
.charCard[data-w="creator"] .stk:nth-child(4){top:60%;left:-8%;animation-delay:0.3s}
.charCard[data-w="writer"] .stk:nth-child(1){top:12%;left:-10%;animation-delay:0.2s}
.charCard[data-w="writer"] .stk:nth-child(2){top:40%;right:-10%;animation-delay:0.6s}
.charCard[data-w="writer"] .stk:nth-child(3){bottom:20%;left:-8%;animation-delay:0s}
.charCard[data-w="writer"] .stk:nth-child(4){top:65%;right:-8%;animation-delay:0.4s}
.charCard[data-w="facts"] .stk:nth-child(1){top:6%;right:-10%;animation-delay:0.3s}
.charCard[data-w="facts"] .stk:nth-child(2){top:30%;left:-12%;animation-delay:0.7s}
.charCard[data-w="facts"] .stk:nth-child(3){bottom:25%;right:-8%;animation-delay:0.1s}
.charCard[data-w="facts"] .stk:nth-child(4){top:55%;left:-8%;animation-delay:0.5s}

.charLabel{margin-top:0.6rem;text-align:center}
.charNum{font-size:0.6rem;letter-spacing:0.18em;color:#5a5570;display:block;margin-bottom:0.15rem}
.charName{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:700;font-size:1rem;color:#f2eff9;display:block;transition:color 0.2s}
.charCard[data-w="coder"]:hover .charName{color:#22d3ee}
.charCard[data-w="creator"]:hover .charName{color:#fb923c}
.charCard[data-w="writer"]:hover .charName{color:#818cf8}
.charCard[data-w="facts"]:hover .charName{color:#f9a8d4}

/* overlay for world transition */
#wOverlay{position:fixed;inset:0;z-index:500;opacity:0;pointer-events:none}

/* skip + sound */
#skipBtn{position:fixed;bottom:1.8rem;right:1.8rem;z-index:100;font-family:'Plus Jakarta Sans',sans-serif;font-size:0.7rem;letter-spacing:0.12em;text-transform:uppercase;color:#5a5570;background:none;border:1px solid rgba(255,255,255,0.08);padding:0.5rem 1rem;border-radius:2rem;cursor:pointer;opacity:0;transition:color 0.2s,border-color 0.2s,opacity 0.5s}
#skipBtn:hover{color:#f2eff9;border-color:rgba(255,255,255,0.2)}
#soundBtn{position:fixed;bottom:1.8rem;left:1.8rem;z-index:100;font-size:1rem;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:50%;width:36px;height:36px;cursor:pointer;opacity:0;display:flex;align-items:center;justify-content:center;transition:opacity 0.5s}

@media(max-width:640px){.charsGrid{grid-template-columns:repeat(2,1fr);gap:1rem}}
</style>
</head>
<body>

<div id="cursor"></div>
<canvas id="starCanvas"></canvas>
<canvas id="orbCanvas"></canvas>
<div id="wOverlay"></div>

<!-- HI SCREEN -->
<div id="layerHi" class="layer">
  <span class="hiText" id="hiHi">Hi!</span>
  <span class="hiText" id="hiIm">I'm</span>
  <span class="hiText" id="hiName">Diya.</span>
</div>

<!-- IDENTITY SCREEN -->
<div id="layerIdentity" class="layer">
  <span class="idLabel">I'm</span>
  <span id="idWord">a creator.</span>
  <div id="idFinal">I'm here to make a <em>difference.</em></div>
</div>

<!-- HUB SCREEN -->
<div id="layerHub" class="layer">
  <span class="hubEye" id="hubEye">choose your world</span>
  <h1 class="hubTitle" id="hubTitle">Which Diya do you want to meet?</h1>
  <div class="charsGrid" id="charsGrid">

    <div class="charCard" data-w="coder" onclick="enterWorld('coder')">
      <span class="stk">💻</span><span class="stk">⟨/⟩</span><span class="stk">⚡</span><span class="stk">🔒</span>
      <div class="charImgWrap"><img class="charImg" src="coder.png" alt="Coder Diya"/></div>
      <div class="charLabel"><span class="charNum">WORLD 01</span><span class="charName">Coder Diya</span></div>
    </div>

    <div class="charCard" data-w="creator" onclick="enterWorld('creator')">
      <span class="stk">📱</span><span class="stk">🎬</span><span class="stk">❤️</span><span class="stk">✨</span>
      <div class="charImgWrap"><img class="charImg" src="creator.png" alt="Creator Diya"/></div>
      <div class="charLabel"><span class="charNum">WORLD 02</span><span class="charName">Creator Diya</span></div>
    </div>

    <div class="charCard" data-w="writer" onclick="enterWorld('writer')">
      <span class="stk">✍️</span><span class="stk">🌙</span><span class="stk">🪶</span><span class="stk">📖</span>
      <div class="charImgWrap"><img class="charImg" src="writer.png" alt="Writer Diya"/></div>
      <div class="charLabel"><span class="charNum">WORLD 03</span><span class="charName">Writer Diya</span></div>
    </div>

    <div class="charCard" data-w="facts" onclick="enterWorld('facts')">
      <span class="stk">🧶</span><span class="stk">🎵</span><span class="stk">🌸</span><span class="stk">☕</span>
      <div class="charImgWrap"><img class="charImg" src="random.png" alt="Just Diya"/></div>
      <div class="charLabel"><span class="charNum">WORLD 04</span><span class="charName">Just Diya</span></div>
    </div>

  </div>
</div>

<button id="skipBtn" onclick="skipToHub()">Skip intro</button>
<button id="soundBtn">🔊</button>

<script>
// ── CURSOR ──
document.addEventListener('mousemove', e => {
  const c = document.getElementById('cursor');
  c.style.left = e.clientX + 'px';
  c.style.top = e.clientY + 'px';
});

// ── SOUND ──
let soundOn = true;
let actx = null;
function tryInitAudio() {
  if (actx) return;
  try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){}
}
['click','keydown','touchstart'].forEach(ev => document.addEventListener(ev, tryInitAudio, {once:true}));
document.getElementById('soundBtn').onclick = () => {
  soundOn = !soundOn;
  document.getElementById('soundBtn').textContent = soundOn ? '🔊' : '🔇';
};
function playTone(freq, dur, vol) {
  if (!soundOn || !actx) return;
  try {
    const o = actx.createOscillator(), g = actx.createGain();
    o.connect(g); g.connect(actx.destination);
    o.type = 'triangle'; o.frequency.value = freq;
    g.gain.setValueAtTime(vol||0.1, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
    o.start(); o.stop(actx.currentTime + dur);
  } catch(e){}
}
function chime(f){ playTone(f||523, 0.6, 0.1); }
function revealChime(){ [523,659,784,1046].forEach((f,i)=>setTimeout(()=>chime(f),i*80)); }

// ── STARS ──
const SC = document.getElementById('starCanvas');
const SX = SC.getContext('2d');
let stars = [];
function resizeStars() {
  SC.width = innerWidth; SC.height = innerHeight;
  stars = Array.from({length:120},()=>({
    x:Math.random()*SC.width, y:Math.random()*SC.height,
    r:Math.random()*1.2+0.15, o:Math.random()*0.3+0.05,
    sp:Math.random()*0.4+0.05
  }));
}
function drawStars() {
  SX.clearRect(0,0,SC.width,SC.height);
  stars.forEach(s=>{
    s.o += Math.sin(Date.now()*s.sp*0.001)*0.004;
    SX.beginPath(); SX.arc(s.x,s.y,s.r,0,Math.PI*2);
    SX.fillStyle=`rgba(200,190,255,${Math.abs(s.o)})`; SX.fill();
  });
}

// ── ORB ──
const OC = document.getElementById('orbCanvas');
const OX = OC.getContext('2d');
let ox, oy, ovx=3.5, ovy=0;
const OR = 22;
let particles=[], trailPts=[], bCount=0, orbDone=false;
const FLOOR_RATIO = 0.72;

function resizeOrb() {
  OC.width = innerWidth; OC.height = innerHeight;
  ox = innerWidth/2; oy = -50;
}

function spawnP(x,y) {
  for(let i=0;i<12;i++){
    const a=(Math.PI*2/12)*i+Math.random()*0.5, sp=Math.random()*2.5+1;
    particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-1,
      life:1,r:Math.random()*3+1.5,
      c:['#b8a9f8','#e0abfc','#93c5fd','#c4b5fd'][0|Math.random()*4]});
  }
}

function drawOrb(x,y,sx,sy,alpha) {
  sx=sx||1; sy=sy||1; alpha=alpha!==undefined?alpha:1;
  OX.save(); OX.translate(x,y); OX.scale(sx,sy);
  const r=OR;
  const g1=OX.createRadialGradient(0,0,r*0.1,0,0,r*3);
  g1.addColorStop(0,`rgba(184,169,248,${0.28*alpha})`);
  g1.addColorStop(0.5,`rgba(124,58,237,${0.1*alpha})`);
  g1.addColorStop(1,'rgba(0,0,0,0)');
  OX.beginPath(); OX.arc(0,0,r*3,0,Math.PI*2); OX.fillStyle=g1; OX.fill();
  const g2=OX.createRadialGradient(-r*.3,-r*.3,r*.05,0,0,r);
  g2.addColorStop(0,`rgba(255,255,255,${0.95*alpha})`);
  g2.addColorStop(0.3,`rgba(200,180,255,${0.9*alpha})`);
  g2.addColorStop(0.7,`rgba(124,58,237,${0.85*alpha})`);
  g2.addColorStop(1,`rgba(55,15,130,${0.8*alpha})`);
  OX.beginPath(); OX.arc(0,0,r,0,Math.PI*2); OX.fillStyle=g2; OX.fill();
  OX.beginPath();
  OX.ellipse(-r*.28,-r*.3,r*.2,r*.12,-Math.PI/4,0,Math.PI*2);
  OX.fillStyle=`rgba(255,255,255,${0.55*alpha})`; OX.fill();
  OX.restore();
}

let settling=false, settled=false;
let settleStartTime=0, settleFromX=0, settleFromY=0;
let orbAlpha=1;

function updateOrb() {
  OX.clearRect(0,0,OC.width,OC.height);

  // particles
  particles=particles.filter(p=>p.life>0);
  particles.forEach(p=>{
    p.x+=p.vx; p.y+=p.vy; p.vy+=0.07; p.life-=0.025;
    const h=(p.life*255|0).toString(16).padStart(2,'0');
    const pr = Math.max(0.01, p.r*p.life);
    OX.beginPath(); OX.arc(p.x,p.y,pr,0,Math.PI*2);
    OX.fillStyle=p.c+h; OX.fill();
  });

  // trail
  trailPts.push({x:ox,y:oy,t:Date.now()});
  trailPts=trailPts.filter(p=>Date.now()-p.t<220);
  trailPts.forEach((p,i)=>{
    const a=(i/trailPts.length)*0.1, r2=Math.max(0.01, OR*(i/trailPts.length)*0.45);
    OX.beginPath(); OX.arc(p.x,p.y,r2,0,Math.PI*2);
    OX.fillStyle=`rgba(184,169,248,${a})`; OX.fill();
  });

  if (orbDone) {
    // fade out
    orbAlpha = Math.max(0, orbAlpha - 0.015);
    if (orbAlpha > 0) drawOrb(ox,oy,1,1,orbAlpha);
    return;
  }

  if (settled) {
    // float
    const fy = oy + Math.sin(Date.now()*0.002)*5;
    drawOrb(ox,fy,1,1,1);
    return;
  }

  if (settling) {
    const elapsed = Date.now() - settleStartTime;
    const dur = 700;
    const t = Math.min(elapsed/dur, 1);
    const e = 1 - Math.pow(1-t,3); // ease out cubic
    const tx = innerWidth/2, ty = innerHeight/2;
    ox = settleFromX + (tx-settleFromX)*e;
    oy = settleFromY + (ty-settleFromY)*e;
    drawOrb(ox,oy,1,1,1);
    if (t >= 1) {
      settling=false; settled=true;
      revealChime();
      setTimeout(startHiScreen, 400);
    }
    return;
  }

  // BOUNCING
  ovy += 0.55; ox += ovx; oy += ovy;
  const FLOOR = OC.height*FLOOR_RATIO;
  const sy = ovy>0?1.12:1, sx = ovy>0?0.88:1;

  if (oy+OR >= FLOOR && ovy > 0) {
    oy = FLOOR-OR;
    ovy *= -0.62;
    bCount++;
    spawnP(ox, FLOOR);
    playTone(150+bCount*25,'sine',0.14,0.18);
    if (bCount >= 4) {
      settling=true;
      settleStartTime=Date.now();
      settleFromX=ox; settleFromY=oy;
    }
  }
  if (ox-OR > OC.width) ox=-OR;
  if (ox+OR < 0) ox=OC.width+OR;

  drawOrb(ox,oy,sx,sy,1);
}

// ── MAIN LOOP ──
function loop() {
  drawStars();
  updateOrb();
  requestAnimationFrame(loop);
}

// ── SEQUENCE HELPERS ──
function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }

function fadeIn(el, ms) {
  return new Promise(r=>{
    el.style.transition=`opacity ${ms}ms ease`;
    el.style.opacity='1';
    setTimeout(r, ms);
  });
}
function fadeOut(el, ms) {
  return new Promise(r=>{
    el.style.transition=`opacity ${ms}ms ease`;
    el.style.opacity='0';
    setTimeout(()=>{ el.style.pointerEvents='none'; r(); }, ms);
  });
}

// ── HI SCREEN ──
async function startHiScreen() {
  const layer = document.getElementById('layerHi');
  const hi = document.getElementById('hiHi');
  const im = document.getElementById('hiIm');
  const nm = document.getElementById('hiName');
  layer.classList.add('show');
  // show skip/sound
  document.getElementById('skipBtn').style.opacity='1';
  document.getElementById('soundBtn').style.opacity='1';

  await sleep(200);
  hi.classList.add('in'); chime(523);
  await sleep(320);
  im.classList.add('in');
  await sleep(320);
  nm.classList.add('in'); chime(880);

  await sleep(2200);
  // fade out hi + name, keep im
  hi.style.transition='opacity 0.4s'; hi.style.opacity='0';
  nm.style.transition='opacity 0.4s'; nm.style.opacity='0';
  await sleep(500);

  // hide orb
  orbDone=true;

  await fadeOut(layer, 400);
  startIdentityScreen();
}

// ── IDENTITY SCREEN ──
const IDS=['a creator.','a coder.','a writer.','an editor.',
  'a storyteller.','a student.','a dreamer.','a builder.','an entrepreneur.'];
const FREQS=[523,587,659,698,784,880,988,1047,1175];

async function startIdentityScreen() {
  const layer = document.getElementById('layerIdentity');
  const wd = document.getElementById('idWord');
  const fn = document.getElementById('idFinal');
  wd.style.opacity='0'; fn.style.opacity='0';
  fn.classList.remove('in');
  layer.classList.add('show');

  await sleep(200);

  for(let i=0;i<IDS.length;i++){
    wd.textContent = IDS[i];
    wd.classList.add('in');
    chime(FREQS[i]);
    await sleep(i<6?700:900);
    wd.classList.remove('in');
    await sleep(350);
  }

  wd.style.display='none';
  await sleep(200);
  fn.classList.add('in');
  revealChime();
  await sleep(2800);

  await fadeOut(layer, 600);
  startHub();
}

// ── HUB ──
function startHub() {
  const layer = document.getElementById('layerHub');
  layer.classList.add('show');
  revealChime();

  setTimeout(()=>document.getElementById('hubEye').classList.add('in'), 250);
  setTimeout(()=>document.getElementById('hubTitle').classList.add('in'), 400);
  setTimeout(()=>{
    const grid = document.getElementById('charsGrid');
    grid.classList.add('in');
    grid.querySelectorAll('.charCard').forEach((c,i)=>{
      setTimeout(()=>c.classList.add('in'), i*130);
    });
  }, 650);

  document.getElementById('skipBtn').style.display='none';
}

// ── SKIP ──
function skipToHub() {
  orbDone=true;
  ['layerHi','layerIdentity'].forEach(id=>{
    const el=document.getElementById(id);
    el.style.opacity='0'; el.style.pointerEvents='none';
    el.classList.remove('show');
  });
  document.getElementById('skipBtn').style.display='none';
  startHub();
}

// ── WORLD ENTER ──
const WC={coder:'#22d3ee',creator:'#fb923c',writer:'#818cf8',facts:'#f9a8d4'};
const WF={coder:'world-coder.html',creator:'world-creator.html',writer:'world-writer.html',facts:'world-facts.html'};
function enterWorld(w) {
  const ov=document.getElementById('wOverlay');
  ov.style.background=WC[w];
  ov.style.transition='opacity 0.5s ease';
  ov.style.opacity='1';
  setTimeout(()=>window.location.href=WF[w], 520);
}

// ── BOOT ──
window.addEventListener('resize',()=>{ resizeStars(); resizeOrb(); });
resizeStars();

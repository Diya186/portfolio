<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Diya — Interactive Universe</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --black: #07060c;
      --white: #f2eff9;
      --muted: #5a5570;
    }
    html, body {
      width: 100%; height: 100%;
      background: var(--black);
      color: var(--white);
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow: hidden;
      cursor: none;
    }

    /* CURSOR */
    #cursor {
      position: fixed; width: 8px; height: 8px; border-radius: 50%;
      background: #b8a9f8; pointer-events: none; z-index: 9999;
      transform: translate(-50%,-50%); mix-blend-mode: screen;
      box-shadow: 0 0 12px 4px rgba(184,169,248,0.6);
    }

    /* CANVASES */
    #bg-canvas { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; }
    #orb-canvas { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }

    /* ALL SCREENS hidden by default */
    .screen {
      position: fixed; inset: 0; z-index: 5;
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none;
      transition: none;
    }

    /* HI SCREEN */
    #screen-hi { flex-direction: column; text-align: center; gap: 0.05em; }
    .hi-word {
      font-family: 'Cormorant Garamond', serif; font-weight: 700;
      font-size: clamp(3.5rem, 11vw, 9.5rem); line-height: 0.95;
      letter-spacing: -0.01em; display: block; opacity: 0;
    }
    .hi-name {
      font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 700;
      font-size: clamp(3.5rem, 11vw, 9.5rem); line-height: 0.95;
      background: linear-gradient(135deg, #b8a9f8 0%, #e0abfc 50%, #93c5fd 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text; display: block; opacity: 0;
    }

    /* IDENTITY SCREEN */
    #screen-identity { flex-direction: column; align-items: flex-start; padding: 0 10vw; gap: 1rem; }
    .identity-label {
      font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 500;
      font-size: clamp(0.85rem, 1.5vw, 1.1rem); color: var(--muted);
      letter-spacing: 0.1em; text-transform: uppercase;
    }
    .identity-word {
      font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 700;
      font-size: clamp(3.5rem, 9vw, 8rem); letter-spacing: -0.02em; line-height: 1;
      background: linear-gradient(135deg, #b8a9f8, #e0abfc);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text; display: block; opacity: 0;
    }
    .identity-final {
      font-family: 'Cormorant Garamond', serif; font-weight: 700;
      font-size: clamp(2.5rem, 6.5vw, 6rem); letter-spacing: -0.02em;
      line-height: 1.05; color: var(--white); opacity: 0; max-width: 16ch;
      margin-top: 1rem;
    }
    .identity-final em {
      font-style: italic;
      background: linear-gradient(135deg, #b8a9f8, #e0abfc, #93c5fd);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* HUB SCREEN */
    #screen-hub {
      flex-direction: column; align-items: center;
      gap: 2rem; padding: 1rem 4vw;
      overflow-y: auto;
    }
    .hub-eyebrow {
      font-size: 0.72rem; letter-spacing: 0.22em; text-transform: uppercase;
      color: var(--muted); opacity: 0;
    }
    .hub-title {
      font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 700;
      font-size: clamp(1.6rem, 3.5vw, 2.8rem); letter-spacing: -0.01em;
      text-align: center; opacity: 0;
    }

    /* CHARACTER GRID */
    .chars-grid {
      display: grid; grid-template-columns: repeat(4, 1fr);
      gap: 1.5rem; width: min(960px, 90vw); opacity: 0;
    }
    .char-card {
      display: flex; flex-direction: column; align-items: center;
      cursor: pointer; position: relative;
    }
    .char-img-wrap {
      width: 100%; aspect-ratio: 0.72;
      display: flex; align-items: flex-end; justify-content: center;
    }
    .char-img {
      width: 100%; height: 100%; object-fit: contain; object-position: bottom;
      filter: drop-shadow(0 8px 24px rgba(0,0,0,0.5));
      transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1), filter 0.3s ease;
      transform-origin: bottom center;
    }
    .char-card:hover .char-img { transform: translateY(-10px) scale(1.04); }
    .char-card[data-world="coder"]:hover .char-img { filter: drop-shadow(0 8px 32px rgba(34,211,238,0.4)); }
    .char-card[data-world="creator"]:hover .char-img { filter: drop-shadow(0 8px 32px rgba(251,146,60,0.4)); }
    .char-card[data-world="writer"]:hover .char-img { filter: drop-shadow(0 8px 32px rgba(129,140,248,0.4)); }
    .char-card[data-world="facts"]:hover .char-img { filter: drop-shadow(0 8px 32px rgba(249,168,212,0.4)); }

    /* stickers */
    .stk {
      position: absolute; font-size: 1rem; opacity: 0; pointer-events: none;
      transition: opacity 0.3s ease;
      animation: stk-float 3s ease-in-out infinite;
    }
    .char-card:hover .stk { opacity: 1; }
    @keyframes stk-float {
      0%,100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-6px) rotate(3deg); }
    }
    .char-card[data-world="coder"] .stk:nth-child(1) { top:8%; left:-8%; animation-delay:0s; }
    .char-card[data-world="coder"] .stk:nth-child(2) { top:25%; right:-8%; animation-delay:0.4s; }
    .char-card[data-world="coder"] .stk:nth-child(3) { top:55%; left:-10%; animation-delay:0.8s; }
    .char-card[data-world="coder"] .stk:nth-child(4) { bottom:18%; right:-6%; animation-delay:0.2s; }
    .char-card[data-world="creator"] .stk:nth-child(1) { top:8%; right:-8%; animation-delay:0.1s; }
    .char-card[data-world="creator"] .stk:nth-child(2) { top:35%; left:-10%; animation-delay:0.5s; }
    .char-card[data-world="creator"] .stk:nth-child(3) { bottom:22%; right:-10%; animation-delay:0.9s; }
    .char-card[data-world="creator"] .stk:nth-child(4) { top:60%; left:-8%; animation-delay:0.3s; }
    .char-card[data-world="writer"] .stk:nth-child(1) { top:12%; left:-10%; animation-delay:0.2s; }
    .char-card[data-world="writer"] .stk:nth-child(2) { top:40%; right:-10%; animation-delay:0.6s; }
    .char-card[data-world="writer"] .stk:nth-child(3) { bottom:20%; left:-8%; animation-delay:0s; }
    .char-card[data-world="writer"] .stk:nth-child(4) { top:65%; right:-8%; animation-delay:0.4s; }
    .char-card[data-world="facts"] .stk:nth-child(1) { top:6%; right:-10%; animation-delay:0.3s; }
    .char-card[data-world="facts"] .stk:nth-child(2) { top:30%; left:-12%; animation-delay:0.7s; }
    .char-card[data-world="facts"] .stk:nth-child(3) { bottom:25%; right:-8%; animation-delay:0.1s; }
    .char-card[data-world="facts"] .stk:nth-child(4) { top:55%; left:-8%; animation-delay:0.5s; }

    .char-label { margin-top: 0.6rem; text-align: center; }
    .char-num { font-size: 0.6rem; letter-spacing: 0.18em; color: var(--muted); display: block; margin-bottom: 0.15rem; }
    .char-name {
      font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 700;
      font-size: 1rem; color: var(--white); display: block;
      transition: color 0.2s;
    }
    .char-card[data-world="coder"]:hover .char-name { color: #22d3ee; }
    .char-card[data-world="creator"]:hover .char-name { color: #fb923c; }
    .char-card[data-world="writer"]:hover .char-name { color: #818cf8; }
    .char-card[data-world="facts"]:hover .char-name { color: #f9a8d4; }

    /* TRANSITION OVERLAY */
    #overlay { position: fixed; inset: 0; z-index: 200; pointer-events: none; opacity: 0; }

    /* CONTROLS */
    #skip-btn {
      position: fixed; bottom: 1.8rem; right: 1.8rem; z-index: 50;
      font-size: 0.7rem; letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--muted); background: none;
      border: 1px solid rgba(255,255,255,0.07);
      padding: 0.5rem 1rem; border-radius: 2rem; cursor: pointer; opacity: 0;
      transition: color 0.2s, border-color 0.2s;
    }
    #skip-btn:hover { color: var(--white); border-color: rgba(255,255,255,0.2); }
    #sound-btn {
      position: fixed; bottom: 1.8rem; left: 1.8rem; z-index: 50;
      font-size: 1rem; background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.07); border-radius: 50%;
      width: 36px; height: 36px; cursor: pointer; opacity: 0;
      display: flex; align-items: center; justify-content: center;
    }

    @media (max-width: 640px) {
      .chars-grid { grid-template-columns: repeat(2, 1fr); gap: 1rem; }
    }
  </style>
</head>
<body>

<div id="cursor"></div>
<canvas id="bg-canvas"></canvas>
<canvas id="orb-canvas"></canvas>
<div id="overlay"></div>

<!-- SCREEN: Hi I'm Diya -->
<div id="screen-hi" class="screen">
  <span class="hi-word" id="hw">Hi!</span>
  <span class="hi-word" id="iw">I'm</span>
  <span class="hi-name" id="dw">Diya.</span>
</div>

<!-- SCREEN: Identity -->
<div id="screen-identity" class="screen">
  <span class="identity-label">I'm</span>
  <span class="identity-word" id="identity-word">a creator.</span>
  <div class="identity-final" id="identity-final">I'm here to make a <em>difference.</em></div>
</div>

<!-- SCREEN: Hub -->
<div id="screen-hub" class="screen">
  <span class="hub-eyebrow" id="hub-ey">choose your world</span>
  <h1 class="hub-title" id="hub-ti">Which Diya do you want to meet?</h1>
  <div class="chars-grid" id="chars-grid">

    <div class="char-card" data-world="coder" onclick="enterWorld('coder')">
      <span class="stk">💻</span><span class="stk">⟨/⟩</span><span class="stk">⚡</span><span class="stk">🔒</span>
      <div class="char-img-wrap"><img class="char-img" src="coder.png" alt="Coder Diya" /></div>
      <div class="char-label"><span class="char-num">WORLD 01</span><span class="char-name">Coder Diya</span></div>
    </div>

    <div class="char-card" data-world="creator" onclick="enterWorld('creator')">
      <span class="stk">📱</span><span class="stk">🎬</span><span class="stk">❤️</span><span class="stk">✨</span>
      <div class="char-img-wrap"><img class="char-img" src="creator.png" alt="Creator Diya" /></div>
      <div class="char-label"><span class="char-num">WORLD 02</span><span class="char-name">Creator Diya</span></div>
    </div>

    <div class="char-card" data-world="writer" onclick="enterWorld('writer')">
      <span class="stk">✍️</span><span class="stk">🌙</span><span class="stk">🪶</span><span class="stk">📖</span>
      <div class="char-img-wrap"><img class="char-img" src="writer.png" alt="Writer Diya" /></div>
      <div class="char-label"><span class="char-num">WORLD 03</span><span class="char-name">Writer Diya</span></div>
    </div>

    <div class="char-card" data-world="facts" onclick="enterWorld('facts')">
      <span class="stk">🧶</span><span class="stk">🎵</span><span class="stk">🌸</span><span class="stk">☕</span>
      <div class="char-img-wrap"><img class="char-img" src="random.png" alt="Just Diya" /></div>
      <div class="char-label"><span class="char-num">WORLD 04</span><span class="char-name">Just Diya</span></div>
    </div>

  </div>
</div>

<button id="skip-btn" onclick="skipToHub()">Skip intro</button>
<button id="sound-btn">🔊</button>

<script>
// ─────────────────────────────────────────────
// AUDIO
// ─────────────────────────────────────────────
let soundOn = true, actx = null;
function initAudio() {
  if (actx) return;
  try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){}
}
function tone(freq, type, dur, vol) {
  if (!soundOn || !actx) return;
  try {
    const o = actx.createOscillator(), g = actx.createGain();
    o.connect(g); g.connect(actx.destination);
    o.type = type || 'sine'; o.frequency.value = freq;
    o.frequency.exponentialRampToValueAtTime(freq * 0.5, actx.currentTime + dur);
    g.gain.setValueAtTime(vol || 0.15, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
    o.start(); o.stop(actx.currentTime + dur);
  } catch(e) {}
}
function chime(f) { tone(f || 523, 'triangle', 0.7, 0.1); }
function bounce_sfx(n) { tone(150 + n * 25, 'sine', 0.14, 0.18); }
function whoosh() {
  if (!soundOn || !actx) return;
  try {
    const buf = actx.createBuffer(1, actx.sampleRate * 0.3, actx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const s = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain();
    f.type = 'bandpass'; f.frequency.value = 500;
    s.buffer = buf; s.connect(f); f.connect(g); g.connect(actx.destination);
    g.gain.setValueAtTime(0.1, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + 0.3);
    s.start(); s.stop(actx.currentTime + 0.3);
  } catch(e) {}
}
function reveal_sfx() { [523,659,784,1046].forEach((f,i) => setTimeout(() => chime(f), i * 80)); }

document.getElementById('sound-btn').addEventListener('click', () => {
  soundOn = !soundOn;
  document.getElementById('sound-btn').textContent = soundOn ? '🔊' : '🔇';
});

// ─────────────────────────────────────────────
// STARS
// ─────────────────────────────────────────────
const bgC = document.getElementById('bg-canvas');
const bgX = bgC.getContext('2d');
let stars = [];
function initStars() {
  bgC.width = window.innerWidth; bgC.height = window.innerHeight;
  stars = Array.from({length: 120}, () => ({
    x: Math.random() * bgC.width, y: Math.random() * bgC.height,
    r: Math.random() * 1.2 + 0.15, o: Math.random() * 0.3 + 0.05,
    sp: Math.random() * 0.4 + 0.05
  }));
}
function drawStars() {
  bgX.clearRect(0, 0, bgC.width, bgC.height);
  stars.forEach(s => {
    s.o += Math.sin(Date.now() * s.sp * 0.001) * 0.004;
    bgX.beginPath(); bgX.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    bgX.fillStyle = `rgba(200,190,255,${Math.abs(s.o)})`; bgX.fill();
  });
}

// ─────────────────────────────────────────────
// ORB
// ─────────────────────────────────────────────
const oC = document.getElementById('orb-canvas');
const oX = oC.getContext('2d');
let orbX, orbY, orbVX = 3.5, orbVY = 0;
const ORB_R = 22;
let ptcls = [], trail = [], bounceCount = 0;
let orbPhase = 'waiting'; // waiting → falling → settling → done

function initOrb() {
  oC.width = window.innerWidth; oC.height = window.innerHeight;
  orbX = window.innerWidth / 2; orbY = -50;
}

function spawnPtcl(x, y) {
  for (let i = 0; i < 12; i++) {
    const a = (Math.PI * 2 / 12) * i + Math.random() * 0.5;
    const sp = Math.random() * 2.5 + 1;
    ptcls.push({
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 1,
      life: 1, r: Math.random() * 3 + 1.5,
      c: ['#b8a9f8','#e0abfc','#93c5fd','#c4b5fd'][Math.floor(Math.random() * 4)]
    });
  }
}

function drawOrbAt(x, y, r, sx, sy, alpha) {
  sx = sx || 1; sy = sy || 1; alpha = alpha !== undefined ? alpha : 1;
  oX.save(); oX.translate(x, y); oX.scale(sx, sy);
  const g1 = oX.createRadialGradient(0, 0, r * 0.1, 0, 0, r * 2.8);
  g1.addColorStop(0, `rgba(184,169,248,${0.25 * alpha})`);
  g1.addColorStop(0.5, `rgba(124,58,237,${0.1 * alpha})`);
  g1.addColorStop(1, 'rgba(0,0,0,0)');
  oX.beginPath(); oX.arc(0, 0, r * 2.8, 0, Math.PI * 2); oX.fillStyle = g1; oX.fill();
  const g2 = oX.createRadialGradient(-r*0.3, -r*0.3, r*0.05, 0, 0, r);
  g2.addColorStop(0, `rgba(255,255,255,${0.95 * alpha})`);
  g2.addColorStop(0.3, `rgba(196,181,253,${0.9 * alpha})`);
  g2.addColorStop(0.7, `rgba(124,58,237,${0.85 * alpha})`);
  g2.addColorStop(1, `rgba(55,15,130,${0.8 * alpha})`);
  oX.beginPath(); oX.arc(0, 0, r, 0, Math.PI * 2); oX.fillStyle = g2; oX.fill();
  oX.beginPath();
  oX.ellipse(-r*0.28, -r*0.3, r*0.2, r*0.12, -Math.PI/4, 0, Math.PI*2);
  oX.fillStyle = `rgba(255,255,255,${0.55 * alpha})`; oX.fill();
  oX.restore();
}

function orbLoop() {
  oX.clearRect(0, 0, oC.width, oC.height);

  // particles
  ptcls = ptcls.filter(p => p.life > 0);
  ptcls.forEach(p => {
    p.x += p.vx; p.y += p.vy; p.vy += 0.07; p.life -= 0.025;
    oX.beginPath(); oX.arc(p.x, p.y, p.r * p.life, 0, Math.PI * 2);
    const hex = Math.floor(p.life * 255).toString(16).padStart(2, '0');
    oX.fillStyle = p.c + hex; oX.fill();
  });

  // trail
  trail.push({x: orbX, y: orbY, t: Date.now()});
  trail = trail.filter(p => Date.now() - p.t < 220);
  trail.forEach((p, i) => {
    const a = (i / trail.length) * 0.1;
    const r2 = ORB_R * (i / trail.length) * 0.45;
    oX.beginPath(); oX.arc(p.x, p.y, r2, 0, Math.PI * 2);
    oX.fillStyle = `rgba(184,169,248,${a})`; oX.fill();
  });

  if (orbPhase === 'falling') {
    orbVY += 0.55;
    orbX += orbVX;
    orbY += orbVY;
    const FLOOR = oC.height * 0.7;
    const sy = orbVY > 0 ? 1.12 : 1;
    const sx = orbVY > 0 ? 0.88 : 1;
    if (orbY + ORB_R >= FLOOR && orbVY > 0) {
      orbY = FLOOR - ORB_R;
      orbVY *= -0.62;
      bounceCount++;
      spawnPtcl(orbX, FLOOR);
      bounce_sfx(bounceCount);
      if (bounceCount >= 4) {
        orbPhase = 'settling';
        settleOrb();
      }
    }
    if (orbX - ORB_R > oC.width) orbX = -ORB_R;
    if (orbX + ORB_R < 0) orbX = oC.width + ORB_R;
    drawOrbAt(orbX, orbY, ORB_R, sx, sy);
  } else if (orbPhase === 'settling') {
    drawOrbAt(orbX, orbY, ORB_R);
  } else if (orbPhase === 'floating') {
    const fy = orbY + Math.sin(Date.now() * 0.002) * 5;
    drawOrbAt(orbX, fy, ORB_R);
  }
}

// Use plain JS interval-based tween instead of GSAP for orb (avoids GSAP object issues)
function settleOrb() {
  const targetX = oC.width / 2;
  const targetY = oC.height / 2;
  const startX = orbX, startY = orbY;
  const dur = 700; // ms
  const start = performance.now();

  function tick(now) {
    const t = Math.min((now - start) / dur, 1);
    // ease out back
    const e = 1 - Math.pow(1 - t, 3);
    orbX = startX + (targetX - startX) * e;
    orbY = startY + (targetY - startY) * e;
    if (t < 1) {
      requestAnimationFrame(tick);
    } else {
      orbX = targetX; orbY = targetY;
      orbPhase = 'floating';
      reveal_sfx();
      // START THE TEXT SEQUENCE
      setTimeout(runHiScreen, 400);
    }
  }
  requestAnimationFrame(tick);
}

// ─────────────────────────────────────────────
// MAIN LOOP
// ─────────────────────────────────────────────
let raf;
function mainLoop() {
  drawStars();
  orbLoop();
  raf = requestAnimationFrame(mainLoop);
}

// ─────────────────────────────────────────────
// HELPERS
// ─────────────────────────────────────────────
function delay(ms) { return new Promise(r => setTimeout(r, ms)); }

function showScreen(id) {
  const el = document.getElementById(id);
  el.style.opacity = '0';
  el.style.pointerEvents = 'all';
  // fade in
  let start = null;
  function tick(ts) {
    if (!start) start = ts;
    const p = Math.min((ts - start) / 400, 1);
    el.style.opacity = p;
    if (p < 1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

function hideScreen(id, cb) {
  const el = document.getElementById(id);
  let start = null;
  function tick(ts) {
    if (!start) start = ts;
    const p = Math.min((ts - start) / 350, 1);
    el.style.opacity = 1 - p;
    if (p < 1) requestAnimationFrame(tick);
    else { el.style.pointerEvents = 'none'; if (cb) cb(); }
  }
  requestAnimationFrame(tick);
}

function fadeEl(el, toOpacity, duration, cb) {
  const from = parseFloat(el.style.opacity) || 0;
  let start = null;
  function tick(ts) {
    if (!start) start = ts;
    const p = Math.min((ts - start) / duration, 1);
    el.style.opacity = from + (toOpacity - from) * p;
    if (p < 1) requestAnimationFrame(tick);
    else { el.style.opacity = toOpacity; if (cb) cb(); }
  }
  requestAnimationFrame(tick);
}

function slideIn(el, duration, cb) {
  el.style.opacity = '0';
  el.style.transform = 'translateY(28px)';
  let start = null;
  function tick(ts) {
    if (!start) start = ts;
    const p = Math.min((ts - start) / duration, 1);
    const e = 1 - Math.pow(1 - p, 3);
    el.style.opacity = e;
    el.style.transform = `translateY(${28 * (1 - e)}px)`;
    if (p < 1) requestAnimationFrame(tick);
    else { el.style.opacity = '1'; el.style.transform = 'none'; if (cb) cb(); }
  }
  requestAnimationFrame(tick);
}

// ─────────────────────────────────────────────
// SEQUENCE: Hi I'm Diya
// ─────────────────────────────────────────────
async function runHiScreen() {
  // fade out orb canvas
  fadeEl(oC, 0, 500);

  showScreen('screen-hi');
  // show skip/sound
  setTimeout(() => {
    fadeEl(document.getElementById('skip-btn'), 1, 400);
    fadeEl(document.getElementById('sound-btn'), 1, 400);
  }, 400);

  const hw = document.getElementById('hw');
  const iw = document.getElementById('iw');
  const dw = document.getElementById('dw');

  await delay(300);
  slideIn(hw, 550); chime(523);
  await delay(320);
  slideIn(iw, 550);
  await delay(320);
  slideIn(dw, 650); chime(880);
  await delay(2200);

  // fade out hi and diya, keep "I'm"
  fadeEl(hw, 0, 400);
  fadeEl(dw, 0, 400);
  await delay(500);

  hideScreen('screen-hi', () => runIdentityScreen());
}

// ─────────────────────────────────────────────
// SEQUENCE: Identity
// ─────────────────────────────────────────────
const IDENTITIES = [
  'a creator.', 'a coder.', 'a writer.', 'an editor.',
  'a storyteller.', 'a student.', 'a dreamer.', 'a builder.', 'an entrepreneur.'
];
const FREQS = [523, 587, 659, 698, 784, 880, 988, 1047, 1175];

async function runIdentityScreen() {
  showScreen('screen-identity');
  const wd = document.getElementById('identity-word');
  const fn = document.getElementById('identity-final');
  wd.style.opacity = '0';
  fn.style.opacity = '0';

  await delay(200);

  for (let i = 0; i < IDENTITIES.length; i++) {
    wd.textContent = IDENTITIES[i];
    wd.style.transform = 'translateX(-18px)';
    // slide in
    let s1 = null;
    await new Promise(res => {
      function tin(ts) {
        if (!s1) s1 = ts;
        const p = Math.min((ts - s1) / 380, 1);
        const e = 1 - Math.pow(1 - p, 2);
        wd.style.opacity = e;
        wd.style.transform = `translateX(${-18 * (1 - e)}px)`;
        if (p < 1) requestAnimationFrame(tin);
        else { wd.style.opacity = '1'; wd.style.transform = 'none'; res(); }
      }
      requestAnimationFrame(tin);
    });
    chime(FREQS[i]);
    await delay(i < 6 ? 680 : 900);
    // slide out
    let s2 = null;
    await new Promise(res => {
      function tout(ts) {
        if (!s2) s2 = ts;
        const p = Math.min((ts - s2) / 280, 1);
        wd.style.opacity = 1 - p;
        wd.style.transform = `translateX(${18 * p}px)`;
        if (p < 1) requestAnimationFrame(tout);
        else { wd.style.opacity = '0'; res(); }
      }
      requestAnimationFrame(tout);
    });
    await delay(300);
  }

  // show final statement
  wd.style.opacity = '0';
  await delay(300);
  let sf = null;
  await new Promise(res => {
    function tfin(ts) {
      if (!sf) sf = ts;
      const p = Math.min((ts - sf) / 1100, 1);
      fn.style.opacity = p;
      if (p < 1) requestAnimationFrame(tfin);
      else { fn.style.opacity = '1'; res(); }
    }
    requestAnimationFrame(tfin);
  });
  reveal_sfx();

  await delay(2800);
  hideScreen('screen-identity', () => runHub());
}

// ─────────────────────────────────────────────
// SEQUENCE: Hub
// ─────────────────────────────────────────────
function runHub() {
  whoosh();
  showScreen('screen-hub');
  const ey = document.getElementById('hub-ey');
  const ti = document.getElementById('hub-ti');
  const gr = document.getElementById('chars-grid');
  ey.style.opacity = '0'; ti.style.opacity = '0'; gr.style.opacity = '0';

  setTimeout(() => fadeEl(ey, 1, 500), 250);
  setTimeout(() => slideIn(ti, 700), 400);
  setTimeout(() => {
    gr.style.opacity = '1';
    // stagger each card
    const cards = gr.querySelectorAll('.char-card');
    cards.forEach((card, i) => {
      card.style.opacity = '0';
      card.style.transform = 'translateY(24px) scale(0.96)';
      setTimeout(() => slideIn(card, 550), i * 130);
    });
  }, 650);
  reveal_sfx();
}

// ─────────────────────────────────────────────
// SKIP
// ─────────────────────────────────────────────
function skipToHub() {
  orbPhase = 'done';
  cancelAnimationFrame(raf);
  oC.style.opacity = '0';
  ['screen-hi','screen-identity'].forEach(id => {
    const el = document.getElementById(id);
    el.style.opacity = '0'; el.style.pointerEvents = 'none';
  });
  document.getElementById('skip-btn').style.display = 'none';
  runHub();
  // restart loop just for stars
  function starsOnly() { drawStars(); requestAnimationFrame(starsOnly); }
  starsOnly();
}

// WORLD TRANSITIONS
// ─────────────────────────────────────────────
const WORLD_COLORS = { coder:'#22d3ee', creator:'#fb923c', writer:'#818cf8', facts:'#f9a8d4' };
const WORLD_FILES  = { coder:'world-coder.html', creator:'world-creator.html', writer:'world-writer.html', facts:'world-facts.html' };

function enterWorld(w) {
  const ov = document.getElementById('overlay');
  ov.style.background = WORLD_COLORS[w];
  whoosh(); chime(880);
  let start = null;
  function tick(ts) {
    if (!start) start = ts;
    const p = Math.min((ts - start) / 450, 1);
    ov.style.opacity = p;
    if (p < 1) requestAnimationFrame(tick);
    else window.location.href = WORLD_FILES[w];
  }
  requestAnimationFrame(tick);
}

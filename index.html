<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Diya — Universe</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;cursor:none}

/* custom cursor */
#cur{position:fixed;width:10px;height:10px;border-radius:50%;background:#d4a8f0;pointer-events:none;z-index:99999;transform:translate(-50%,-50%);mix-blend-mode:multiply;transition:width .15s,height .15s}

/* ── STAGE 1: light bg, ball ── */
#stage1{position:fixed;inset:0;background:#faf8f5;z-index:10;display:flex;align-items:flex-end;justify-content:center}

/* ── STAGE 2: dark, Hi I'm Diya ── */
#stage2{position:fixed;inset:0;background:#07060c;z-index:5;opacity:0;display:flex;align-items:center;justify-content:center;flex-direction:column}

/* ── STAGE 3: identity ── */
#stage3{position:fixed;inset:0;background:#07060c;z-index:5;opacity:0;display:flex;align-items:center}
#im-word{
  font-family:'Cormorant Garamond',serif;font-weight:700;
  font-size:clamp(3.5rem,8vw,8rem);color:#f2eff9;
  position:absolute;left:50%;transform:translateX(-50%);
  white-space:nowrap;opacity:0;
}
#rolling-window{
  position:absolute;left:50%;
  height:clamp(4rem,9vw,9rem);
  overflow:hidden;
  opacity:0;
}
#rolling-inner{
  display:flex;flex-direction:column;
  gap:0;
}
.roll-item{
  font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:700;
  font-size:clamp(3.5rem,8vw,8rem);line-height:1.05;
  background:linear-gradient(135deg,#b8a9f8,#e0abfc);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  white-space:nowrap;padding:0 0.1em;
}

/* ── STAGE 4: I'm here ── */
#stage4{position:fixed;inset:0;background:#07060c;z-index:5;opacity:0;display:flex;align-items:center;justify-content:center;}
#here-text{
  font-family:'Cormorant Garamond',serif;font-weight:700;
  font-size:clamp(2.5rem,6vw,6rem);color:#f2eff9;text-align:center;
  line-height:1.15;max-width:14ch;opacity:0;
}
#here-text em{
  font-style:italic;
  background:linear-gradient(135deg,#b8a9f8,#e0abfc,#93c5fd);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}

/* ── STAGE 5: hub ── */
#stage5{position:fixed;inset:0;background:#07060c;z-index:5;opacity:0;pointer-events:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.5rem;padding:2rem}
#stage5.live{pointer-events:all}
#hub-label{font-family:'Plus Jakarta Sans',sans-serif;font-size:.68rem;letter-spacing:.22em;text-transform:uppercase;color:#5a5570;opacity:0}
#hub-title{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:700;font-size:clamp(1.4rem,3vw,2.4rem);color:#f2eff9;opacity:0;text-align:center}
#chars-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:2rem;width:min(960px,90vw)}

.char-card{display:flex;flex-direction:column;align-items:center;cursor:pointer;position:relative;opacity:0;transform:translateY(22px)}
.char-img-wrap{width:100%;aspect-ratio:.72;display:flex;align-items:flex-end;justify-content:center}
.char-img{width:85%;height:100%;object-fit:contain;object-position:bottom;filter:drop-shadow(0 8px 20px rgba(0,0,0,.5));animation:charFloat 4s ease-in-out infinite;transform-origin:bottom center}
.char-card:nth-child(1) .char-img{animation-delay:0s}
.char-card:nth-child(2) .char-img{animation-delay:.7s}
.char-card:nth-child(3) .char-img{animation-delay:1.4s}
.char-card:nth-child(4) .char-img{animation-delay:2.1s}
@keyframes charFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.char-card:hover .char-img{animation-play-state:paused;transition:filter .3s}
.char-card[data-w=coder]:hover .char-img{filter:drop-shadow(0 12px 32px rgba(34,211,238,.5))}
.char-card[data-w=creator]:hover .char-img{filter:drop-shadow(0 12px 32px rgba(251,146,60,.5))}
.char-card[data-w=writer]:hover .char-img{filter:drop-shadow(0 12px 32px rgba(129,140,248,.5))}
.char-card[data-w=facts]:hover .char-img{filter:drop-shadow(0 12px 32px rgba(249,168,212,.5))}
.stk{position:absolute;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .25s;animation:stkf 3s ease-in-out infinite}
.char-card:hover .stk{opacity:1}
@keyframes stkf{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-6px) rotate(4deg)}}
.char-card[data-w=coder] .stk:nth-child(1){top:8%;left:-5%;animation-delay:0s}
.char-card[data-w=coder] .stk:nth-child(2){top:30%;right:-5%;animation-delay:.4s}
.char-card[data-w=coder] .stk:nth-child(3){top:58%;left:-8%;animation-delay:.8s}
.char-card[data-w=coder] .stk:nth-child(4){bottom:16%;right:-4%;animation-delay:.2s}
.char-card[data-w=creator] .stk:nth-child(1){top:8%;right:-5%;animation-delay:.1s}
.char-card[data-w=creator] .stk:nth-child(2){top:35%;left:-8%;animation-delay:.5s}
.char-card[data-w=creator] .stk:nth-child(3){bottom:20%;right:-7%;animation-delay:.9s}
.char-card[data-w=creator] .stk:nth-child(4){top:60%;left:-5%;animation-delay:.3s}
.char-card[data-w=writer] .stk:nth-child(1){top:12%;left:-7%;animation-delay:.2s}
.char-card[data-w=writer] .stk:nth-child(2){top:40%;right:-7%;animation-delay:.6s}
.char-card[data-w=writer] .stk:nth-child(3){bottom:18%;left:-5%;animation-delay:0s}
.char-card[data-w=writer] .stk:nth-child(4){top:65%;right:-5%;animation-delay:.4s}
.char-card[data-w=facts] .stk:nth-child(1){top:6%;right:-7%;animation-delay:.3s}
.char-card[data-w=facts] .stk:nth-child(2){top:32%;left:-9%;animation-delay:.7s}
.char-card[data-w=facts] .stk:nth-child(3){bottom:22%;right:-5%;animation-delay:.1s}
.char-card[data-w=facts] .stk:nth-child(4){top:57%;left:-5%;animation-delay:.5s}
.char-label{margin-top:.7rem;text-align:center}
.char-num{font-size:.58rem;letter-spacing:.18em;color:#5a5570;display:block;margin-bottom:.1rem}
.char-name{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:700;font-size:.95rem;color:#f2eff9;display:block;transition:color .2s}
.char-card[data-w=coder]:hover .char-name{color:#22d3ee}
.char-card[data-w=creator]:hover .char-name{color:#fb923c}
.char-card[data-w=writer]:hover .char-name{color:#818cf8}
.char-card[data-w=facts]:hover .char-name{color:#f9a8d4}

/* world transition */
#w-overlay{position:fixed;inset:0;z-index:500;opacity:0;pointer-events:none;transition:opacity .5s ease}

/* skip */
#skip-btn{position:fixed;bottom:1.8rem;right:1.8rem;z-index:200;font-family:'Plus Jakarta Sans',sans-serif;font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:#5a5570;background:none;border:1px solid rgba(255,255,255,.08);padding:.45rem .9rem;border-radius:2rem;cursor:pointer;opacity:0;pointer-events:none;transition:color .2s,border-color .2s}
#skip-btn.on{opacity:1;pointer-events:all}
#skip-btn:hover{color:#f2eff9;border-color:rgba(255,255,255,.2)}
#snd-btn{position:fixed;bottom:1.8rem;left:1.8rem;z-index:200;font-size:.9rem;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:50%;width:34px;height:34px;cursor:pointer;opacity:0;pointer-events:none;display:flex;align-items:center;justify-content:center}
#snd-btn.on{opacity:1;pointer-events:all}

/* mascot canvas */
#mascot-canvas{position:fixed;z-index:20;pointer-events:none}

/* stars canvas */
#star-canvas{position:fixed;inset:0;width:100%;height:100%;z-index:4;pointer-events:none;opacity:0}

@media(max-width:640px){#chars-grid{grid-template-columns:repeat(2,1fr);gap:1.2rem}}
</style>
</head>
<body>

<div id="cur"></div>
<canvas id="mascot-canvas" width="120" height="120"></canvas>
<canvas id="star-canvas"></canvas>
<div id="w-overlay"></div>

<!-- STAGE 1: light -->
<div id="stage1"></div>

<!-- STAGE 2: Hi I'm Diya -->
<div id="stage2">
  <div id="hi-block" style="text-align:center;display:flex;flex-direction:column;align-items:center;gap:.05em">
    <span id="t-hi"  style="font-family:'Cormorant Garamond',serif;font-weight:700;font-size:clamp(2.2rem,5vw,4.5rem);opacity:0;transform:translateY(20px);transition:opacity .55s ease,transform .55s ease;display:block">Hi!</span>
    <span id="t-im"  style="font-family:'Cormorant Garamond',serif;font-weight:700;font-size:clamp(2.2rem,5vw,4.5rem);opacity:0;transform:translateY(20px);transition:opacity .55s ease,transform .55s ease;display:block">I'm</span>
    <span id="t-diya"style="font-family:'Cormorant Garamond',serif;font-weight:700;font-size:clamp(2.2rem,5vw,4.5rem);font-style:italic;opacity:0;transform:translateY(20px);transition:opacity .55s ease,transform .55s ease;display:block;background:linear-gradient(135deg,#b8a9f8,#e0abfc,#93c5fd);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text">Diya.</span>
  </div>
</div>

<!-- STAGE 3: I'm + rolling -->
<div id="stage3">
  <div id="im-word">I'm</div>
  <div id="rolling-window"><div id="rolling-inner"></div></div>
</div>

<!-- STAGE 4: I'm here -->
<div id="stage4">
  <p id="here-text">I'm here to make a <em>difference.</em></p>
</div>

<!-- STAGE 5: hub -->
<div id="stage5">
  <span id="hub-label">choose your world</span>
  <h1 id="hub-title">Which version of me would you like to meet first?</h1>
  <div id="chars-grid">
    <div class="char-card" data-w="coder" onclick="enterWorld('coder')">
      <span class="stk">💻</span><span class="stk">⟨/⟩</span><span class="stk">⚡</span><span class="stk">🔒</span>
      <div class="char-img-wrap"><img class="char-img" src="coder.png" alt="Coder Diya"/></div>
      <div class="char-label"><span class="char-num">WORLD 01</span><span class="char-name">Coder Diya</span></div>
    </div>
    <div class="char-card" data-w="creator" onclick="enterWorld('creator')">
      <span class="stk">📱</span><span class="stk">🎬</span><span class="stk">❤️</span><span class="stk">✨</span>
      <div class="char-img-wrap"><img class="char-img" src="creator.png" alt="Creator Diya"/></div>
      <div class="char-label"><span class="char-num">WORLD 02</span><span class="char-name">Creator Diya</span></div>
    </div>
    <div class="char-card" data-w="writer" onclick="enterWorld('writer')">
      <span class="stk">✍️</span><span class="stk">🌙</span><span class="stk">🪶</span><span class="stk">📖</span>
      <div class="char-img-wrap"><img class="char-img" src="writer.png" alt="Writer Diya"/></div>
      <div class="char-label"><span class="char-num">WORLD 03</span><span class="char-name">Writer Diya</span></div>
    </div>
    <div class="char-card" data-w="facts" onclick="enterWorld('facts')">
      <span class="stk">🧶</span><span class="stk">🎵</span><span class="stk">🌸</span><span class="stk">☕</span>
      <div class="char-img-wrap"><img class="char-img" src="random.png" alt="Just Diya"/></div>
      <div class="char-label"><span class="char-num">WORLD 04</span><span class="char-name">Just Diya</span></div>
    </div>
  </div>
</div>

<button id="skip-btn" onclick="skipAll()">Skip intro</button>
<button id="snd-btn">🔊</button>

<script>
// ─────────────────────────────────────────
// CURSOR
// ─────────────────────────────────────────
const curEl=document.getElementById('cur');
let mx=innerWidth/2,my=innerHeight/2;
document.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;curEl.style.left=mx+'px';curEl.style.top=my+'px';});

// ─────────────────────────────────────────
// AUDIO
// ─────────────────────────────────────────
let sndOn=true,actx=null;
function initAudio(){if(actx)return;try{actx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}
['click','keydown','touchstart'].forEach(ev=>document.addEventListener(ev,initAudio,{once:true}));
document.getElementById('snd-btn').onclick=()=>{sndOn=!sndOn;document.getElementById('snd-btn').textContent=sndOn?'🔊':'🔇';};
function tone(f,dur,vol,type){
  if(!sndOn||!actx)return;
  try{const o=actx.createOscillator(),g=actx.createGain();o.connect(g);g.connect(actx.destination);o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(vol||.12,actx.currentTime);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+dur);o.start();o.stop(actx.currentTime+dur);}catch(e){}
}
function chime(f){tone(f||523,.6,.08,'triangle');}
function bounceTone(n){tone(200-n*15,.1,.2,'sine');}
function revealChime(){[523,659,784,1046].forEach((f,i)=>setTimeout(()=>chime(f),i*90));}
function whoosh(){
  if(!sndOn||!actx)return;
  try{const b=actx.createBuffer(1,actx.sampleRate*.4,actx.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;const s=actx.createBufferSource(),fl=actx.createBiquadFilter(),g=actx.createGain();fl.type='bandpass';fl.frequency.value=500;s.buffer=b;s.connect(fl);fl.connect(g);g.connect(actx.destination);g.gain.setValueAtTime(.1,actx.currentTime);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+.4);s.start();s.stop(actx.currentTime+.4);}catch(e){}
}

// ─────────────────────────────────────────
// STARS
// ─────────────────────────────────────────
const SC=document.getElementById('star-canvas'),SX=SC.getContext('2d');
let stars=[];
function initStars(){
  SC.width=innerWidth;SC.height=innerHeight;
  stars=Array.from({length:140},()=>({x:Math.random()*SC.width,y:Math.random()*SC.height,r:Math.random()*1.1+.15,o:Math.random()*.3+.04,sp:Math.random()*.4+.05}));
}
function drawStars(){
  SX.clearRect(0,0,SC.width,SC.height);
  stars.forEach(s=>{s.o+=Math.sin(Date.now()*s.sp*.001)*.003;SX.beginPath();SX.arc(s.x,s.y,s.r,0,Math.PI*2);SX.fillStyle=`rgba(200,190,255,${Math.abs(s.o)})`;SX.fill();});
}

// ─────────────────────────────────────────
// MASCOT (canvas 2d smiley orb with eyes)
// ─────────────────────────────────────────
const MC=document.getElementById('mascot-canvas');
const MX=MC.getContext('2d');
let msc={
  x:innerWidth/2,y:-60,       // position
  vx:3.2,vy:0,                 // velocity
  r:22,                         // radius
  phase:'idle',                 // idle|bounce|settling|corner|watching|blink|transform
  blinks:false,blinkT:0,
  eyeOpen:1,                    // 0=closed 1=open
  lookX:0,lookY:0,              // eye direction -1..1
  squashX:1,squashY:1,
  alpha:1,
  bounceN:0,
  ptcls:[],trail:[],
  settleT:0,sfX:0,sfY:0,
  cornerX:0,cornerY:0,
  // corner target (bottom-left)
};
let mascotDone=false;
let onMascotDone=null; // callback when mascot finishes corner phase

function mscSize(){
  MC.width=innerWidth;
  MC.height=innerHeight;
  MC.style.cssText=`position:fixed;top:0;left:0;width:${innerWidth}px;height:${innerHeight}px;z-index:20;pointer-events:none`;
}

function drawMascot(){
  MX.clearRect(0,0,MC.width,MC.height);
  if(mascotDone)return;

  // particles
  msc.ptcls=msc.ptcls.filter(p=>p.life>0);
  msc.ptcls.forEach(p=>{
    p.x+=p.vx;p.y+=p.vy;p.vy+=.06;p.life-=.022;
    const pr=Math.max(.01,p.r*p.life);
    const h=(Math.max(0,p.life*255)|0).toString(16).padStart(2,'0');
    MX.beginPath();MX.arc(p.x,p.y,pr,0,Math.PI*2);MX.fillStyle=p.c+h;MX.fill();
  });

  // trail
  msc.trail.push({x:msc.x,y:msc.y,t:Date.now()});
  msc.trail=msc.trail.filter(p=>Date.now()-p.t<180);
  msc.trail.forEach((p,i)=>{
    const a=(i/msc.trail.length)*.08,r2=Math.max(.01,msc.r*(i/msc.trail.length)*.4);
    MX.beginPath();MX.arc(p.x,p.y,r2,0,Math.PI*2);MX.fillStyle=`rgba(255,182,193,${a})`;MX.fill();
  });

  const {x,y,r,squashX,squashY,alpha,eyeOpen,lookX,lookY}=msc;
  MX.save();MX.globalAlpha=alpha;MX.translate(x,y);MX.scale(squashX,squashY);

  // glow
  const g1=MX.createRadialGradient(0,0,r*.1,0,0,r*2.8);
  g1.addColorStop(0,'rgba(255,182,193,.35)');g1.addColorStop(.6,'rgba(255,105,180,.1)');g1.addColorStop(1,'rgba(0,0,0,0)');
  MX.beginPath();MX.arc(0,0,r*2.8,0,Math.PI*2);MX.fillStyle=g1;MX.fill();

  // body — pink ball
  const g2=MX.createRadialGradient(-r*.3,-r*.3,r*.05,0,0,r);
  g2.addColorStop(0,'#fff0f5');g2.addColorStop(.4,'#ffb6c1');g2.addColorStop(.8,'#ff69b4');g2.addColorStop(1,'#c71585');
  MX.beginPath();MX.arc(0,0,r,0,Math.PI*2);MX.fillStyle=g2;MX.fill();

  // shine
  MX.beginPath();MX.ellipse(-r*.3,-r*.32,r*.22,r*.13,-Math.PI/4,0,Math.PI*2);MX.fillStyle='rgba(255,255,255,.6)';MX.fill();

  // eyes (appear after transform phase)
  if(msc.phase==='corner'||msc.phase==='watching'||msc.phase==='blink'||msc.phase==='ready'){
    const eyeR=r*.18;
    const eyeOffX=r*.28,eyeOffY=-r*.08;
    // pupils look toward visitor
    const px=lookX*eyeR*.5,py=lookY*eyeR*.5;
    [-1,1].forEach(side=>{
      const ex=eyeOffX*side,ey=eyeOffY;
      // white
      MX.beginPath();MX.arc(ex,ey,eyeR,0,Math.PI*2);MX.fillStyle='#fff';MX.fill();
      // pupil
      const eH=eyeR*(eyeOpen>.5?1:eyeOpen*2);
      if(eH>.01){
        MX.save();MX.beginPath();MX.ellipse(ex+px,ey+py,eyeR*.5,eH*.5,0,0,Math.PI*2);MX.fillStyle='#1a0a2e';MX.fill();
        // catchlight
        MX.beginPath();MX.arc(ex+px+eyeR*.1,ey+py-eyeR*.12,eyeR*.12,0,Math.PI*2);MX.fillStyle='rgba(255,255,255,.8)';MX.fill();
        MX.restore();
      }
    });

    // smile
    if(msc.phase==='ready'||msc.phase==='watching'){
      MX.beginPath();MX.arc(0,r*.2,r*.3,0,Math.PI);MX.strokeStyle='#1a0a2e';MX.lineWidth=r*.08;MX.lineCap='round';MX.stroke();
    }
  }

  MX.restore();
}

function spawnPtcl(x,y,color){
  for(let i=0;i<12;i++){
    const a=(Math.PI*2/12)*i+Math.random()*.6,sp=Math.random()*2.5+.8;
    msc.ptcls.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-.8,life:1,r:Math.random()*3+1.5,c:color||'#ffb6c1'});
  }
}

// ─────────────────────────────────────────
// RAF HELPERS
// ─────────────────────────────────────────
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function raf(fn){return new Promise(res=>{
  let t0=null;
  function tick(now){if(!t0)t0=now;const done=fn(now-t0);if(!done)requestAnimationFrame(tick);else res();}
  requestAnimationFrame(tick);
});}
function lerp(a,b,t){return a+(b-a)*t;}
function easeOut(t){return 1-Math.pow(1-t,3);}
function easeInOut(t){return t<.5?2*t*t:-1+(4-2*t)*t;}
function animVal(dur,fn){return raf(elapsed=>{const t=Math.min(elapsed/dur,1);fn(t);return t>=1;});}
function fadeEl(el,from,to,dur){return animVal(dur,t=>el.style.opacity=lerp(from,to,easeOut(t)));}

// ─────────────────────────────────────────
// MAIN LOOP
// ─────────────────────────────────────────
let running=true;
function loop(){
  if(!running)return;
  drawStars();
  updateMascot();
  drawMascot();
  requestAnimationFrame(loop);
}

// ─────────────────────────────────────────
// MASCOT UPDATE
// ─────────────────────────────────────────
const FLOOR_R=.78; // fraction of screen height for bounce floor
function updateMascot(){
  if(mascotDone)return;
  const FLOOR=innerHeight*FLOOR_R;

  if(msc.phase==='bounce'){
    msc.vy+=.6; msc.x+=msc.vx; msc.y+=msc.vy;
    msc.squashY=msc.vy>0?1.12:1; msc.squashX=msc.vy>0?.88:1;
    if(msc.x-msc.r>MC.width)msc.x=-msc.r;
    if(msc.x+msc.r<0)msc.x=MC.width+msc.r;
    if(msc.y+msc.r>=FLOOR&&msc.vy>0){
      msc.y=FLOOR-msc.r; msc.vy*=-.62;
      msc.bounceN++;
      spawnPtcl(msc.x,FLOOR,'#ffb6c1');
      bounceTone(msc.bounceN);
      if(msc.bounceN>=4){
        // settle to bottom-left corner
        msc.phase='toCorner';
        msc.settleT=Date.now();
        msc.sfX=msc.x; msc.sfY=msc.y;
        msc.cornerX=msc.r*2+20;
        msc.cornerY=MC.height-msc.r*2-20;
      }
    }
  }

  if(msc.phase==='toCorner'){
    const el=Date.now()-msc.settleT,dur=800,t=Math.min(el/dur,1),e=easeOut(t);
    msc.x=lerp(msc.sfX,msc.cornerX,e);
    msc.y=lerp(msc.sfY,msc.cornerY,e);
    msc.squashX=1; msc.squashY=1;
    if(t>=1){msc.phase='blinking';msc.blinkT=Date.now();}
  }

  if(msc.phase==='blinking'){
    // blink twice then trigger transform
    const el=Date.now()-msc.blinkT;
    const cycle=el%600;
    msc.eyeOpen=cycle<80?0:1;
    // look toward center
    msc.lookX=.3; msc.lookY=-.2;
    if(el>1400){
      msc.phase='watching';
      // trigger text sequence
      if(onMascotDone){onMascotDone();onMascotDone=null;}
    }
  }

  if(msc.phase==='watching'){
    // eyes follow cursor
    const dx=mx-msc.x, dy=my-msc.y, dist=Math.sqrt(dx*dx+dy*dy)||1;
    msc.lookX=Math.max(-1,Math.min(1,dx/dist*.6));
    msc.lookY=Math.max(-1,Math.min(1,dy/dist*.6));
    msc.eyeOpen=1;
    msc.squashX=1; msc.squashY=1;
  }

  if(msc.phase==='ready'){
    const dx=mx-msc.x,dy=my-msc.y,dist=Math.sqrt(dx*dx+dy*dy)||1;
    msc.lookX=Math.max(-1,Math.min(1,dx/dist*.6));
    msc.lookY=Math.max(-1,Math.min(1,dy/dist*.6));
  }
}

// ─────────────────────────────────────────
// SEQUENCE
// ─────────────────────────────────────────
let skipped=false;

// STEP 1 — ball bouncing on light bg
async function step1_bounce(){
  msc.phase='bounce';
  msc.x=innerWidth/2; msc.y=-60;
  msc.vx=3.4; msc.vy=0; msc.bounceN=0;
  // wait for mascot to reach corner + blink — max 8s fallback
  await Promise.race([
    new Promise(r=>{onMascotDone=r;}),
    sleep(8000)
  ]);
  if(skipped)return;
  await sleep(400);
  step2_rippleTransition();
}

// STEP 2 — mascot does final bounce, ripple, transition to dark
async function step2_rippleTransition(){
  if(skipped)return;
  // mascot does one big jump
  msc.vy=-14; msc.phase='bounce'; msc.bounceN=0;
  whoosh();
  await sleep(400);
  // ripple + fade to dark
  await rippleTransition();
  // now dark bg active
  document.getElementById('stage1').style.display='none';
  document.getElementById('star-canvas').style.opacity='1';
  msc.phase='watching';
  step3_hiImDiya();
}

// ripple canvas effect
function rippleTransition(){
  return new Promise(res=>{
    const cv=document.createElement('canvas');
    cv.style.cssText='position:fixed;inset:0;z-index:30;pointer-events:none';
    cv.width=innerWidth;cv.height=innerHeight;
    document.body.appendChild(cv);
    const cx=cv.getContext('2d');
    const cx0=msc.x,cy0=msc.y;
    const maxR=Math.sqrt(innerWidth**2+innerHeight**2)*1.1;
    let t0=null;
    const dur=900;
    function tick(now){
      if(!t0)t0=now;
      const p=Math.min((now-t0)/dur,1);
      cx.clearRect(0,0,cv.width,cv.height);
      // growing dark circle from mascot position
      const r=easeOut(p)*maxR;
      cx.beginPath();cx.arc(cx0,cy0,r,0,Math.PI*2);
      cx.fillStyle='#07060c';cx.fill();
      // ripple rings
      for(let i=0;i<3;i++){
        const rr=r-(i*60);
        if(rr>0){
          cx.beginPath();cx.arc(cx0,cy0,rr,0,Math.PI*2);
          cx.strokeStyle=`rgba(180,160,255,${(1-p)*.4})`;cx.lineWidth=2;cx.stroke();
        }
      }
      if(p<1)requestAnimationFrame(tick);
      else{document.body.removeChild(cv);res();}
    }
    requestAnimationFrame(tick);
  });
}

// STEP 3 — Hi I'm Diya
async function step3_hiImDiya(){
  if(skipped)return;
  const s2=document.getElementById('stage2');
  await fadeEl(s2,0,1,500);
  document.getElementById('skip-btn').classList.add('on');
  document.getElementById('snd-btn').classList.add('on');

  const tHi=document.getElementById('t-hi');
  const tIm=document.getElementById('t-im');
  const tDiya=document.getElementById('t-diya');

  await sleep(200);
  tHi.style.opacity='1';tHi.style.transform='translateY(0)';chime(523);
  await sleep(340);
  tIm.style.opacity='1';tIm.style.transform='translateY(0)';
  await sleep(340);
  tDiya.style.opacity='1';tDiya.style.transform='translateY(0)';chime(880);
  await sleep(2600);
  if(skipped)return;

  // fade out Hi! and Diya. — keep I'm
  await Promise.all([
    fadeEl(tHi,1,0,420),
    fadeEl(tDiya,1,0,420)
  ]);
  await sleep(300);
  if(skipped)return;

  // now animate t-im from its current center pos to left side+bigger
  const rect=tIm.getBoundingClientRect();
  const startL=rect.left,startT=rect.top,startSz=parseFloat(getComputedStyle(tIm).fontSize);
  tIm.style.position='fixed';tIm.style.left=startL+'px';tIm.style.top=startT+'px';tIm.style.fontSize=startSz+'px';tIm.style.margin='0';tIm.style.display='block';
  s2.style.display='none'; // hide stage2 bg (stage3 takes over)

  const targetSz=Math.min(innerWidth*.08,100);
  const targetL=innerWidth*.10;
  const targetT=innerHeight*.5-targetSz*.55;

  // show stage3 bg
  const s3=document.getElementById('stage3');
  s3.style.opacity='1';

  await animVal(750,t=>{
    const e=easeInOut(t);
    tIm.style.left=lerp(startL,targetL,e)+'px';
    tIm.style.top=lerp(startT,targetT,e)+'px';
    tIm.style.fontSize=lerp(startSz,targetSz,e)+'px';
  });

  if(skipped)return;
  step4_rolling(tIm,targetL,targetT,targetSz);
}

// STEP 4 — rolling words
const PHASE1=['a creator.','a coder.','a storyteller.','an editor.','a student.','an entrepreneur.'];
const PHASE2=["a dreamer.","a collector of memories.","the friend who takes too many photos.","fueled by late-night ideas.","someone who starts too many projects.","a hopeless romantic."];
const FINAL_PAUSE="still figuring it out.";
const FAST=['Creator','Coder','Writer','Dreamer','Student','Entrepreneur','Storyteller','Memory Collector'];

async function step4_rolling(imEl,imL,imT,imSz){
  if(skipped)return;
  const win=document.getElementById('rolling-window');
  const inner=document.getElementById('rolling-inner');
  const imRect=imEl.getBoundingClientRect();

  win.style.position='fixed';
  win.style.left=(imL+imRect.width+innerWidth*.025)+'px';
  win.style.top=imT+'px';
  win.style.height=imSz*1.1+'px';
  win.style.opacity='1';

  // helper: roll to a word
  async function rollTo(text,holdMs){
    const item=document.createElement('div');
    item.className='roll-item';
    item.textContent=text;
    item.style.fontSize=imSz+'px';
    item.style.lineHeight=imSz*1.1+'px';
    item.style.height=imSz*1.1+'px';
    inner.appendChild(item);

    // slide up
    const startY=parseFloat(inner.style.transform?.replace('translateY(',''))||0);
    const count=inner.children.length;
    const targetY=-((count-1)*imSz*1.1);
    await animVal(380,t=>{inner.style.transform=`translateY(${lerp(startY,targetY,easeOut(t))}px)`;});
    chime([523,587,659,698,784,880,988][Math.floor(Math.random()*7)]);
    await sleep(holdMs);
  }

  // phase 1 — achievement words
  for(const w of PHASE1){if(skipped)return;await rollTo(w,820);}

  // phase 2 — personal words, slowing down
  for(let i=0;i<PHASE2.length;i++){if(skipped)return;await rollTo(PHASE2[i],900+i*180);}

  // PAUSE — "still figuring it out"
  if(skipped)return;
  await rollTo(FINAL_PAUSE,200);
  // slow approach
  await sleep(2800); // long emotional pause
  if(skipped)return;

  // FAST SPIN
  win.style.opacity='1';
  for(let i=0;i<18;i++){
    if(skipped)return;
    await rollTo(FAST[i%FAST.length],Math.max(30,200-i*10));
  }

  // everything disappears
  await Promise.all([
    fadeEl(imEl,1,0,400),
    fadeEl(win,1,0,400)
  ]);
  imEl.style.display='none';
  win.style.display='none';

  if(skipped)return;
  step5_here();
}

// STEP 5 — I'm here to make a difference
async function step5_here(){
  if(skipped)return;
  const s4=document.getElementById('stage4');
  const ht=document.getElementById('here-text');
  s4.style.opacity='1';
  await fadeEl(ht,0,1,1200);
  revealChime();
  await sleep(3500);
  if(skipped)return;
  // fade to black
  await fadeEl(s4,1,0,700);
  step6_hub();
}

// STEP 6 — mascot falls again, characters appear
async function step6_hub(){
  if(skipped)return;
  // mascot falls again from top
  msc.x=innerWidth/2; msc.y=-60;
  msc.vx=0; msc.vy=0; msc.phase='bounce'; msc.bounceN=0;
  msc.eyeOpen=1; msc.alpha=1;
  msc.trail=[];
  mascotDone=false;

  // wait for mascot to bounce once then we take over
  await sleep(1200); // just wait for it to drop and bounce

  // settle mascot to center-bottom of screen
  msc.phase='toCorner';
  msc.settleT=Date.now();
  msc.sfX=msc.x;msc.sfY=msc.y;
  msc.cornerX=innerWidth/2;
  msc.cornerY=innerHeight*.82;
  await sleep(900);
  msc.phase='ready';

  // show hub
  const s5=document.getElementById('stage5');
  s5.style.opacity='1';s5.classList.add('live');
  await fadeEl(document.getElementById('hub-label'),0,1,500);
  await sleep(100);
  await fadeEl(document.getElementById('hub-title'),0,1,700);
  await sleep(200);
  const cards=document.querySelectorAll('.char-card');
  for(let i=0;i<cards.length;i++){
    setTimeout(()=>{
      cards[i].style.opacity='1';
      cards[i].style.transform='translateY(0)';
      cards[i].style.transition='opacity .5s ease,transform .5s ease';
    },i*150+100);
  }
  revealChime();
  document.getElementById('skip-btn').classList.remove('on');
}

// SKIP
function skipAll(){
  skipped=true;
  mascotDone=true;
  ['stage1','stage2','stage3','stage4'].forEach(id=>{
    const el=document.getElementById(id);
    el.style.opacity='0';el.style.display='none';
  });
  document.getElementById('star-canvas').style.opacity='1';
  document.getElementById('skip-btn').classList.remove('on');
  const s5=document.getElementById('stage5');
  s5.style.opacity='1';s5.classList.add('live');
  document.querySelectorAll('.char-card').forEach(c=>{c.style.opacity='1';c.style.transform='translateY(0)';});
  document.getElementById('hub-label').style.opacity='1';
  document.getElementById('hub-title').style.opacity='1';
}

// WORLD NAVIGATION
const WC={coder:'#22d3ee',creator:'#fb923c',writer:'#818cf8',facts:'#f9a8d4'};
const WF={coder:'world-coder.html',creator:'world-creator.html',writer:'world-writer.html',facts:'world-facts.html'};

  whoosh();chime(880);

}

loop();

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Diya — Interactive Universe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Cabinet+Grotesk:wght@400;500;700;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
  <!-- fallback modern fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --black: #07060c;
      --white: #f2eff9;
      --orb-glow: #b8a9f8;
      --accent: #c4b5fd;
      --muted: #5a5570;
      --display: 'Cormorant Garamond', 'Playfair Display', serif;
      --body: 'Plus Jakarta Sans', 'Cabinet Grotesk', sans-serif;
    }

    html, body {
      width: 100%; height: 100%;
      background: var(--black);
      color: var(--white);
      font-family: var(--body);
      overflow: hidden;
      cursor: none;
    }

    /* ── CURSOR ── */
    #cursor {
      position: fixed; width: 8px; height: 8px;
      border-radius: 50%; background: var(--orb-glow);
      pointer-events: none; z-index: 9999;
      transform: translate(-50%, -50%);
      mix-blend-mode: screen;
      box-shadow: 0 0 12px 4px rgba(184,169,248,0.6);
    }
    #cursor-ring {
      position: fixed; width: 28px; height: 28px;
      border-radius: 50%; border: 1px solid rgba(184,169,248,0.35);
      pointer-events: none; z-index: 9998;
      transform: translate(-50%, -50%);
    }

    /* ── CANVASES ── */
    #bg-canvas { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; }
    #orb-canvas { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 11; pointer-events: none; }

    /* ── SCREENS ── */
    .screen {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      z-index: 10; opacity: 0; pointer-events: none;
    }
    .screen.active { opacity: 1; pointer-events: all; }

    /* ── SCREEN 2: HI ── */
    #screen-hi { flex-direction: column; text-align: center; }

    .hi-word {
      font-family: var(--display);
      font-weight: 700;
      font-size: clamp(3rem, 10vw, 9rem);
      line-height: 0.95;
      letter-spacing: -0.01em;
    }
    .hi-name {
      font-family: var(--display);
      font-style: italic;
      font-weight: 700;
      font-size: clamp(3rem, 10vw, 9rem);
      line-height: 0.95;
      background: linear-gradient(135deg, #b8a9f8 0%, #e0abfc 50%, #93c5fd 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* ── SCREEN 3: IDENTITY ── */
    #screen-identity {
      flex-direction: column;
      align-items: flex-start;
      padding: 0 10vw;
    }

    .identity-im {
      font-family: var(--body);
      font-weight: 500;
      font-size: clamp(1rem, 2vw, 1.4rem);
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 0.6rem;
    }

    .identity-word {
      font-family: var(--display);
      font-style: italic;
      font-weight: 700;
      font-size: clamp(3.5rem, 9vw, 8rem);
      letter-spacing: -0.02em;
      line-height: 1;
      background: linear-gradient(135deg, #b8a9f8, #e0abfc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      opacity: 0;
      display: block;
    }

    .identity-final {
      font-family: var(--display);
      font-weight: 700;
      font-size: clamp(2.5rem, 6.5vw, 6rem);
      letter-spacing: -0.02em;
      line-height: 1.05;
      color: var(--white);
      opacity: 0;
      max-width: 16ch;
    }
    .identity-final em {
      font-style: italic;
      background: linear-gradient(135deg, #b8a9f8, #e0abfc, #93c5fd);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* ── SCREEN 4: HUB ── */
    #screen-hub {
      flex-direction: column;
      align-items: center;
      gap: 2.5rem;
      padding: 0 5vw;
    }

    .hub-eyebrow {
      font-family: var(--body);
      font-size: 0.72rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--muted);
      opacity: 0;
    }

    .hub-title {
      font-family: var(--display);
      font-style: italic;
      font-weight: 700;
      font-size: clamp(1.8rem, 4vw, 3.2rem);
      letter-spacing: -0.01em;
      text-align: center;
      opacity: 0;
      color: var(--white);
    }

    /* ── CHARACTER GRID ── */
    .chars-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1.5rem;
      width: min(960px, 92vw);
      opacity: 0;
    }

    .char-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      cursor: pointer;
      position: relative;
    }

    .char-img-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 0.72;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      overflow: visible;
    }

    .char-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: bottom;
      filter: drop-shadow(0 8px 24px rgba(0,0,0,0.5));
      transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1), filter 0.3s ease;
      transform-origin: bottom center;
    }

    .char-card:hover .char-img {
      transform: translateY(-10px) scale(1.04);
    }

    /* per-world glow on hover */
    .char-card[data-world="coder"]:hover .char-img {
      filter: drop-shadow(0 8px 32px rgba(34,211,238,0.35)) drop-shadow(0 0 8px rgba(34,211,238,0.2));
    }
    .char-card[data-world="creator"]:hover .char-img {
      filter: drop-shadow(0 8px 32px rgba(251,146,60,0.35)) drop-shadow(0 0 8px rgba(251,146,60,0.2));
    }
    .char-card[data-world="writer"]:hover .char-img {
      filter: drop-shadow(0 8px 32px rgba(129,140,248,0.35)) drop-shadow(0 0 8px rgba(129,140,248,0.2));
    }
    .char-card[data-world="facts"]:hover .char-img {
      filter: drop-shadow(0 8px 32px rgba(249,168,212,0.4)) drop-shadow(0 0 8px rgba(249,168,212,0.2));
    }

    /* floating stickers around each card */
    .sticker {
      position: absolute;
      font-size: 1rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      animation: float-sticker 3s ease-in-out infinite;
      filter: drop-shadow(0 2px 6px rgba(0,0,0,0.4));
    }
    .char-card:hover .sticker { opacity: 1; }

    @keyframes float-sticker {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      33% { transform: translateY(-5px) rotate(3deg); }
      66% { transform: translateY(3px) rotate(-2deg); }
    }

    /* coder stickers */
    .char-card[data-world="coder"] .sticker:nth-child(1) { top: 10%; left: -10%; animation-delay: 0s; }
    .char-card[data-world="coder"] .sticker:nth-child(2) { top: 25%; right: -8%; animation-delay: 0.4s; }
    .char-card[data-world="coder"] .sticker:nth-child(3) { top: 55%; left: -12%; animation-delay: 0.8s; }
    .char-card[data-world="coder"] .sticker:nth-child(4) { bottom: 18%; right: -6%; animation-delay: 0.2s; }

    /* creator stickers */
    .char-card[data-world="creator"] .sticker:nth-child(1) { top: 8%; right: -8%; animation-delay: 0.1s; }
    .char-card[data-world="creator"] .sticker:nth-child(2) { top: 35%; left: -10%; animation-delay: 0.5s; }
    .char-card[data-world="creator"] .sticker:nth-child(3) { bottom: 22%; right: -10%; animation-delay: 0.9s; }
    .char-card[data-world="creator"] .sticker:nth-child(4) { top: 60%; left: -8%; animation-delay: 0.3s; }

    /* writer stickers */
    .char-card[data-world="writer"] .sticker:nth-child(1) { top: 12%; left: -10%; animation-delay: 0.2s; }
    .char-card[data-world="writer"] .sticker:nth-child(2) { top: 40%; right: -10%; animation-delay: 0.6s; }
    .char-card[data-world="writer"] .sticker:nth-child(3) { bottom: 20%; left: -8%; animation-delay: 0s; }
    .char-card[data-world="writer"] .sticker:nth-child(4) { top: 65%; right: -8%; animation-delay: 0.4s; }

    /* facts stickers */
    .char-card[data-world="facts"] .sticker:nth-child(1) { top: 6%; right: -10%; animation-delay: 0.3s; }
    .char-card[data-world="facts"] .sticker:nth-child(2) { top: 30%; left: -12%; animation-delay: 0.7s; }
    .char-card[data-world="facts"] .sticker:nth-child(3) { bottom: 25%; right: -8%; animation-delay: 0.1s; }
    .char-card[data-world="facts"] .sticker:nth-child(4) { top: 55%; left: -8%; animation-delay: 0.5s; }

    .char-label {
      margin-top: 0.7rem;
      text-align: center;
    }

    .char-world-num {
      font-family: var(--body);
      font-size: 0.6rem;
      letter-spacing: 0.18em;
      color: var(--muted);
      display: block;
      margin-bottom: 0.2rem;
    }

    .char-name {
      font-family: var(--display);
      font-style: italic;
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: -0.01em;
      color: var(--white);
      display: block;
      transition: color 0.2s ease;
    }
    .char-card[data-world="coder"]:hover .char-name { color: #22d3ee; }
    .char-card[data-world="creator"]:hover .char-name { color: #fb923c; }
    .char-card[data-world="writer"]:hover .char-name { color: #818cf8; }
    .char-card[data-world="facts"]:hover .char-name { color: #f9a8d4; }

    /* ── TRANSITION OVERLAY ── */
    #transition-overlay {
      position: fixed; inset: 0; z-index: 200;
      pointer-events: none; opacity: 0;
    }

    /* ── CONTROLS ── */
    #skip-btn {
      position: fixed; bottom: 2rem; right: 2rem; z-index: 100;
      font-family: var(--body); font-size: 0.72rem;
      letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--muted); background: none;
      border: 1px solid rgba(255,255,255,0.07);
      padding: 0.55rem 1.1rem; border-radius: 2rem;
      cursor: pointer; opacity: 0;
      transition: color 0.2s, border-color 0.2s;
    }
    #skip-btn:hover { color: var(--white); border-color: rgba(255,255,255,0.2); }

    #sound-btn {
      position: fixed; bottom: 2rem; left: 2rem; z-index: 100;
      font-size: 1rem; background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.07); border-radius: 50%;
      width: 38px; height: 38px; cursor: pointer; opacity: 0;
      transition: background 0.2s; display: flex;
      align-items: center; justify-content: center;
    }
    #sound-btn:hover { background: rgba(255,255,255,0.08); }

    @media (max-width: 640px) {
      .chars-grid { grid-template-columns: repeat(2, 1fr); gap: 1rem; }
      .sticker { font-size: 0.8rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }

  </style>
</head>
<body>

<div id="cursor"></div>
<div id="cursor-ring"></div>
<canvas id="bg-canvas"></canvas>
<canvas id="orb-canvas"></canvas>
<div id="transition-overlay"></div>



<!-- SCREEN 1: orb (canvas) -->
<div id="screen-orb" class="screen active"></div>

<!-- SCREEN 2: Hi I'm Diya -->
<div id="screen-hi" class="screen">
  <div style="display:flex;flex-direction:column;align-items:center;gap:0.05em">
    <span class="hi-word" id="hi-word" style="opacity:0">Hi!</span>
    <span class="hi-word" id="im-word" style="opacity:0">I'm</span>
    <span class="hi-name" id="diya-word" style="opacity:0">Diya.</span>
  </div>
</div>

<!-- SCREEN 3: Identity -->
<div id="screen-identity" class="screen">
  <div style="display:flex;flex-direction:column;gap:0.5rem">
    <span class="identity-im">I'm</span>
    <span class="identity-word" id="identity-word">a creator.</span>
  </div>
  <div style="margin-top:3rem">
    <div class="identity-final" id="identity-final">
      I'm here to make a <em>difference.</em>
    </div>
  </div>
</div>

<!-- SCREEN 4: Hub with characters -->
<div id="screen-hub" class="screen">
  <div style="text-align:center">
    <div class="hub-eyebrow" id="hub-label">choose your world</div>
    <h1 class="hub-title" id="hub-title">Which Diya do you want to meet?</h1>
  </div>

  <div class="chars-grid" id="chars-grid">

    <!-- CODER -->
    <div class="char-card" data-world="coder" onclick="enterWorld('coder')">
      <span class="sticker">💻</span>
      <span class="sticker">⟨/⟩</span>
      <span class="sticker">⚡</span>
      <span class="sticker">🔒</span>
      <div class="char-img-wrap">
        <img class="char-img" src="coder.png" alt="Coder Diya" />
      </div>
      <div class="char-label">
        <span class="char-world-num">WORLD 01</span>
        <span class="char-name">Coder Diya</span>
      </div>
    </div>

    <!-- CREATOR -->
    <div class="char-card" data-world="creator" onclick="enterWorld('creator')">
      <span class="sticker">📱</span>
      <span class="sticker">🎬</span>
      <span class="sticker">❤️</span>
      <span class="sticker">✨</span>
      <div class="char-img-wrap">
        <img class="char-img" src="creator.png" alt="Creator Diya" />
      </div>
      <div class="char-label">
        <span class="char-world-num">WORLD 02</span>
        <span class="char-name">Creator Diya</span>
      </div>
    </div>

    <!-- WRITER -->
    <div class="char-card" data-world="writer" onclick="enterWorld('writer')">
      <span class="sticker">✍️</span>
      <span class="sticker">🌙</span>
      <span class="sticker">🪶</span>
      <span class="sticker">📖</span>
      <div class="char-img-wrap">
        <img class="char-img" src="writer.png" alt="Writer Diya" />
      </div>
      <div class="char-label">
        <span class="char-world-num">WORLD 03</span>
        <span class="char-name">Writer Diya</span>
      </div>
    </div>

    <!-- RANDOM / FACTS -->
    <div class="char-card" data-world="facts" onclick="enterWorld('facts')">
      <span class="sticker">🧶</span>
      <span class="sticker">🎵</span>
      <span class="sticker">🌸</span>
      <span class="sticker">☕</span>
      <div class="char-img-wrap">
        <img class="char-img" src="random.png" alt="Just Diya" />
      </div>
      <div class="char-label">
        <span class="char-world-num">WORLD 04</span>
        <span class="char-name">Just Diya</span>
      </div>
    </div>

  </div>
</div>

<button id="skip-btn" onclick="skipToHub()">Skip intro</button>
<button id="sound-btn" title="Toggle sound">🔊</button>

<script>
// ── AUDIO ──
let soundEnabled = true;
let ctx;
function initAudio() {
  try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){}
}
function playTone(freq, type='sine', dur=0.18, vol=0.18) {
  if (!soundEnabled || !ctx) return;
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.connect(g); g.connect(ctx.destination);
  o.type = type; o.frequency.value = freq;
  o.frequency.setValueAtTime(freq, ctx.currentTime);
  o.frequency.exponentialRampToValueAtTime(freq * 0.5, ctx.currentTime + dur);
  g.gain.setValueAtTime(vol, ctx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
  o.start(); o.stop(ctx.currentTime + dur);
}
function playBounce(n) { playTone(160 + n * 30, 'sine', 0.15, 0.2); }
function playWhoosh() {
  if (!soundEnabled || !ctx) return;
  const buf = ctx.createBuffer(1, ctx.sampleRate*0.35, ctx.sampleRate);
  const d = buf.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  const s=ctx.createBufferSource(), f=ctx.createBiquadFilter(), g=ctx.createGain();
  f.type='bandpass'; f.frequency.value=600; f.Q.value=1;
  s.buffer=buf; s.connect(f); f.connect(g); g.connect(ctx.destination);
  g.gain.setValueAtTime(0.12, ctx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+0.35);
  s.start(); s.stop(ctx.currentTime+0.35);
}
function playChime(f=523) { playTone(f,'triangle',0.7,0.1); }
function playReveal() { [523,659,784,1046].forEach((f,i)=>setTimeout(()=>playChime(f),i*80)); }

// ── STARS ──
const bgC = document.getElementById('bg-canvas');
const bgX = bgC.getContext('2d');
let stars = [];
function initStars() {
  bgC.width = window.innerWidth; bgC.height = window.innerHeight;
  stars = Array.from({length:100},()=>({
    x: Math.random()*bgC.width, y: Math.random()*bgC.height,
    r: Math.random()*1.1+0.15, o: Math.random()*0.35+0.05,
    sp: Math.random()*0.4+0.05
  }));
}
function drawStars() {
  bgX.clearRect(0,0,bgC.width,bgC.height);
  stars.forEach(s=>{
    s.o += Math.sin(Date.now()*s.sp*0.001)*0.004;
    bgX.beginPath(); bgX.arc(s.x,s.y,s.r,0,Math.PI*2);
    bgX.fillStyle=`rgba(200,190,255,${Math.abs(s.o)})`; bgX.fill();
  });
}

// ── ORB — smaller, tighter ──
const oC = document.getElementById('orb-canvas');
const oX = oC.getContext('2d');
let orb = {x:0,y:-40,vx:3.2,vy:0,r:22};
let ptcls=[], trail=[], bounceN=0, phase='waiting';

function initOrb() {
  oC.width=window.innerWidth; oC.height=window.innerHeight;
  orb.x = window.innerWidth/2; orb.y = -40;
}

function spawnPtcl(x,y,n=10) {
  for(let i=0;i<n;i++){
    const a=(Math.PI*2/n)*i+Math.random()*0.6, sp=Math.random()*2.5+0.8;
    ptcls.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-0.8,
      life:1,r:Math.random()*3+1.5,
      c:['#b8a9f8','#e0abfc','#93c5fd','#c4b5fd'][Math.floor(Math.random()*4)]});
  }
}

function drawOrb(x,y,r,sx=1,sy=1,alpha=1) {
  oX.save(); oX.translate(x,y); oX.scale(sx,sy);
  // outer glow
  const g1=oX.createRadialGradient(0,0,r*0.1,0,0,r*2.8);
  g1.addColorStop(0,`rgba(184,169,248,${0.25*alpha})`);
  g1.addColorStop(0.5,`rgba(124,58,237,${0.1*alpha})`);
  g1.addColorStop(1,'rgba(0,0,0,0)');
  oX.beginPath(); oX.arc(0,0,r*2.8,0,Math.PI*2);
  oX.fillStyle=g1; oX.fill();
  // body
  const g2=oX.createRadialGradient(-r*0.3,-r*0.3,r*0.05,0,0,r);
  g2.addColorStop(0,`rgba(255,255,255,${0.95*alpha})`);
  g2.addColorStop(0.3,`rgba(196,181,253,${0.9*alpha})`);
  g2.addColorStop(0.7,`rgba(124,58,237,${0.85*alpha})`);
  g2.addColorStop(1,`rgba(55,15,130,${0.8*alpha})`);
  oX.beginPath(); oX.arc(0,0,r,0,Math.PI*2);
  oX.fillStyle=g2; oX.fill();
  // shine
  oX.beginPath();
  oX.ellipse(-r*0.28,-r*0.3,r*0.2,r*0.12,-Math.PI/4,0,Math.PI*2);
  oX.fillStyle=`rgba(255,255,255,${0.55*alpha})`; oX.fill();
  oX.restore();
}

function updateOrb() {
  oX.clearRect(0,0,oC.width,oC.height);
  // particles
  ptcls=ptcls.filter(p=>p.life>0);
  ptcls.forEach(p=>{
    p.x+=p.vx; p.y+=p.vy; p.vy+=0.07; p.life-=0.025;
    oX.beginPath(); oX.arc(p.x,p.y,p.r*p.life,0,Math.PI*2);
    oX.fillStyle=p.c+Math.floor(p.life*255).toString(16).padStart(2,'0');
    oX.fill();
  });
  // trail
  trail.push({x:orb.x,y:orb.y,t:Date.now()});
  trail=trail.filter(p=>Date.now()-p.t<250);
  trail.forEach((p,i)=>{
    const a=(i/trail.length)*0.12, r2=orb.r*(i/trail.length)*0.5;
    oX.beginPath(); oX.arc(p.x,p.y,r2,0,Math.PI*2);
    oX.fillStyle=`rgba(184,169,248,${a})`; oX.fill();
  });

  if(phase==='falling'||phase==='bouncing') {
    orb.vy += 0.55; orb.x += orb.vx; orb.y += orb.vy;
    const floor = oC.height*0.72;
    const sy = orb.vy>0 ? 1.12 : 1, sx = orb.vy>0 ? 0.88 : 1;
    if(orb.y+orb.r>=floor && orb.vy>0) {
      orb.y=floor-orb.r; orb.vy*=-0.6; bounceN++;
      spawnPtcl(orb.x,floor,12); playBounce(bounceN);
      if(bounceN>=4) { phase='settling'; setTimeout(settleOrb,150); }
    }
    if(orb.x-orb.r>oC.width) orb.x=-orb.r;
    if(orb.x+orb.r<0) orb.x=oC.width+orb.r;
    drawOrb(orb.x,orb.y,orb.r,sx,sy);
  } else if(phase==='settling') {
    drawOrb(orb.x,orb.y,orb.r);
  } else if(phase==='morphed') {
    const fy = orb.y + Math.sin(Date.now()*0.002)*6;
    drawOrb(orb.x,fy,orb.r);
  }
}

function settleOrb() {
  gsap.to(orb,{x:oC.width/2,y:oC.height/2,duration:0.7,ease:'back.out(1.4)',onComplete:()=>{
    phase='morphed'; playReveal(); setTimeout(startHiSeq,350);
  }});
}

// ── SEQUENCE ──
async function startHiSeq() {
  playWhoosh();
  gsap.to(oC,{opacity:0,duration:0.5});
  const hi=document.getElementById('screen-hi');
  hi.classList.add('active'); gsap.set(hi,{opacity:0});
  gsap.to('#skip-btn',{opacity:1,duration:0.4,delay:0.3});
  gsap.to('#sound-btn',{opacity:1,duration:0.4,delay:0.3});
  const hw=document.getElementById('hi-word'),im=document.getElementById('im-word'),dn=document.getElementById('diya-word');
  gsap.to(hi,{opacity:1,duration:0.35});
  await delay(150);
  gsap.fromTo(hw,{opacity:0,y:30},{opacity:1,y:0,duration:0.55,ease:'power3.out'}); playChime(523);
  await delay(280);
  gsap.fromTo(im,{opacity:0,y:30},{opacity:1,y:0,duration:0.55,ease:'power3.out'});
  await delay(280);
  gsap.fromTo(dn,{opacity:0,y:30},{opacity:1,y:0,duration:0.7,ease:'power3.out'}); playChime(880);
  await delay(2000);
  gsap.to([hw,dn],{opacity:0,duration:0.4});
  await delay(500);
  hi.classList.remove('active'); gsap.set(hi,{opacity:0});
  startIdentitySeq();
}

const ids=['a creator.','a coder.','a writer.','an editor.','a storyteller.',
  'a student.','a dreamer.','a builder.','an entrepreneur.'];

async function startIdentitySeq() {
  const sc=document.getElementById('screen-identity');
  sc.classList.add('active'); gsap.set(sc,{opacity:0}); gsap.to(sc,{opacity:1,duration:0.4});
  const wd=document.getElementById('identity-word'), fn=document.getElementById('identity-final');
  const freqs=[523,587,659,698,784,880,988,1047,1175];
  for(let i=0;i<ids.length;i++){
    wd.textContent=ids[i];
    gsap.fromTo(wd,{opacity:0,x:-18},{opacity:1,x:0,duration:0.38,ease:'power2.out'});
    playChime(freqs[i]);
    await delay(i<6?680:880);
    gsap.to(wd,{opacity:0,x:18,duration:0.28});
    await delay(320);
  }
  await delay(200);
  gsap.to(wd,{opacity:0,duration:0.25});
  await delay(350);
  gsap.to(fn,{opacity:1,duration:1.1,ease:'power2.out'}); playReveal();
  await delay(2600);
  gsap.to(sc,{opacity:0,duration:0.7,onComplete:()=>{ sc.classList.remove('active'); showHub(); }});
}

async function showHub() {
  playWhoosh();
  const hub=document.getElementById('screen-hub');
  hub.classList.add('active'); gsap.set(hub,{opacity:0}); gsap.to(hub,{opacity:1,duration:0.5});
  gsap.to('#hub-label',{opacity:1,duration:0.5,delay:0.2});
  gsap.fromTo('#hub-title',{opacity:0,y:16},{opacity:1,y:0,duration:0.7,delay:0.35,ease:'power3.out'});
  gsap.fromTo('#chars-grid',{opacity:0,y:20},{opacity:1,y:0,duration:0.7,delay:0.55,ease:'power3.out'});
  // stagger each character
  gsap.fromTo('.char-card',
    {opacity:0,y:28,scale:0.95},
    {opacity:1,y:0,scale:1,duration:0.55,stagger:0.12,delay:0.65,ease:'power3.out'}
  );
  playReveal();
}

function skipToHub() {
  cancelAnimationFrame(raf);
  document.querySelectorAll('.screen').forEach(s=>{ s.classList.remove('active'); gsap.set(s,{opacity:0}); });
  gsap.set(oC,{opacity:0}); showHub();
  document.getElementById('skip-btn').style.display='none';
}

// ── WORLD ENTER ──
const worldColors={coder:'#22d3ee',creator:'#fb923c',writer:'#818cf8',facts:'#f9a8d4'};
const worldFiles={coder:'world-coder.html',creator:'world-creator.html',writer:'world-writer.html',facts:'world-facts.html'};

function enterWorld(w) {
  const ov=document.getElementById('transition-overlay');
  ov.style.background=worldColors[w]; playWhoosh(); playChime(880);
  gsap.to(ov,{opacity:1,duration:0.45,ease:'power2.in',onComplete:()=>{ window.location.href=worldFiles[w]; }});
}

// ── CURSOR ──
const cur=document.getElementById('cursor'), ring=document.getElementById('cursor-ring');
let mx=0,my=0,rx=0,ry=0;
document.addEventListener('mousemove',e=>{ mx=e.clientX; my=e.clientY; gsap.to(cur,{x:mx,y:my,duration:0.05}); });
(function tickRing(){ rx+=(mx-rx)*0.1; ry+=(my-ry)*0.1; gsap.set(ring,{x:rx,y:ry}); requestAnimationFrame(tickRing); })();

document.querySelectorAll('.char-card,button').forEach(el=>{
  el.addEventListener('mouseenter',()=>{ gsap.to(cur,{width:18,height:18,duration:0.2}); gsap.to(ring,{scale:1.4,duration:0.2}); });
  el.addEventListener('mouseleave',()=>{ gsap.to(cur,{width:8,height:8,duration:0.2}); gsap.to(ring,{scale:1,duration:0.2}); });
});

// ── SOUND TOGGLE ──
document.getElementById('sound-btn').addEventListener('click',()=>{
  soundEnabled=!soundEnabled;
  document.getElementById('sound-btn').textContent=soundEnabled?'🔊':'🔇';
});

// ── UTIL ──
function delay(ms){ return new Promise(r=>setTimeout(r,ms)); }

// ── MAIN LOOP ──
let raf;
function loop(){ drawStars(); updateOrb(); raf=requestAnimationFrame(loop); }

// ── AUTO START — everything fires on page load, no click needed ──
initStars();
initOrb();
loop();

// start orb falling immediately
phase = 'falling';

// audio context unlocks silently on first any interaction (doesn't block visuals)
document.addEventListener('click', ()=>{ if(!ctx) initAudio(); }, { once: true });
document.addEventListener('keydown', ()=>{ if(!ctx) initAudio(); }, { once: true });
document.addEventListener('mousemove', ()=>{ if(!ctx) initAudio(); }, { once: true });
// also try to init audio immediately (works in some browsers)
initAudio();

window.addEventListener('resize', ()=>{ initStars(); initOrb(); });
</script>
